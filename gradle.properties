org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Heap for the Kotlin/Native compiler, which runs in its OWN daemon and therefore does NOT inherit
# `org.gradle.jvmargs` above.
#
# `:rc-player-compose:linkReleaseFrameworkIosSimulatorArm64` — the release link run by ci.yml's
# player job and by release.yml — died with `OutOfMemoryError: Java heap space` inside
# `ModuleDFGBuilder`, Kotlin/Native's whole-module dataflow pass. That pass is the memory peak of a
# release link: it holds the IR for the module and every dependency at once, and this framework
# links the entire player stack plus Compose Multiplatform's iOS runtime. The default heap does not
# cover it, and the failure takes ~50 minutes of macOS-runner time to arrive.
#
# 4g, not more: the `macos-15` arm64 runner has ~7 GB. The Gradle daemon holds 2 GB above, and the
# two do not peak together — the Gradle daemon is idle while the native compiler links — but there
# is no room to be careless.
kotlin.native.jvmArgs=-Xmx4g
org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=fail
org.gradle.caching=true

# Build-cache salt — an extra declared input on every Kotlin compilation task, so bumping this
# number moves the whole repo to fresh build-cache keys (see ComposeAiBaseConventionsPlugin for the
# why and the cost). Bump it when a build-cache entry is corrupt at rest and can't be evicted: a
# poisoned entry fails during *load*, so the task never executes and never pushes a replacement,
# and no amount of re-running clears it. One cold main build reseeds under the new keys.
composeai.cacheSalt=0

android.useAndroidX=true

# Workaround for Gradle 9 and Kotlin plugin compatibility issue, should be removed when fixed and
# won't be supported in Gradle 10
org.gradle.configuration-cache.unsafe.ignore.unsupported-build-events-listeners=true

# Compose Multiplatform auto-applies a hot-reload sub-plugin that breaks the configuration cache
# (it reads a sibling project's layout from the root project at configuration time). We don't use
# hot reload, so disable it.
org.jetbrains.compose.hot.reload.disable=true
