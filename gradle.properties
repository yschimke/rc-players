# Heap for the Gradle daemon — and therefore for the Kotlin/Native compiler, which by default runs
# *inside this same JVM* rather than in a daemon of its own
# (https://kotlinlang.org/docs/native-improving-compilation-time.html: "By default, Kotlin/Native
# runs from the Gradle daemon ... the same JVM process is used"). That single fact is why the iOS
# release link was unbuildable for so long, and why this one number is the knob that matters.
#
# `:rc-player-compose:linkReleaseFramework{IosArm64,IosSimulatorArm64}` died with
# `OutOfMemoryError: Java heap space` inside `ModuleDFGBuilder`, Kotlin/Native's whole-module
# dataflow pass. That pass is the memory peak of a release link: it holds the IR for the module and
# every dependency at once, and this framework links the entire player stack plus Compose
# Multiplatform's iOS runtime.
#
# The first attempt at a fix set `kotlin.native.jvmArgs=-Xmx4g` and changed nothing — the failure
# was byte-identical, and the log kept reporting `The currently configured max heap space is
# '2 GiB'`, which is *this* property, not that one. `kotlin.native.jvmArgs` sizes an out-of-process
# Kotlin/Native compiler that this build never starts, so it was dead config; it has been removed
# rather than left to imply the link has 4 GB it never had.
#
# 5g, not more: the `macos-15` arm64 runner has ~7 GB, and the link's native phases (`ld`, `lipo`,
# `xcodebuild -create-xcframework`) need real memory outside the JVM heap on top of this. There is
# now only one JVM to budget for, so the whole 5 GB is actually available to the compiler — which
# was never true when the budget was split 2 GB here and a notional 4 GB there.
#
# The two release links must also not run concurrently: sharing one JVM means two `ModuleDFGBuilder`
# passes would peak in the same heap. `ci.yml` and `release.yml` pass `--max-workers=1` on the
# XCFramework invocation for exactly that reason.
org.gradle.jvmargs=-Xmx5g -Dfile.encoding=UTF-8

org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=fail
org.gradle.caching=true

# Build-cache salt — an extra declared input on every Kotlin compilation task, so bumping this
# number moves the whole repo to fresh build-cache keys (see ComposeAiBaseConventionsPlugin for the
# why and the cost). Bump it when a build-cache entry is corrupt at rest and can't be evicted: a
# poisoned entry fails during *load*, so the task never executes and never pushes a replacement,
# and no amount of re-running clears it. One cold main build reseeds under the new keys.
composeai.cacheSalt=0

android.useAndroidX=true

# Workaround for Gradle 9 and Kotlin plugin compatibility issue, should be removed when fixed and
# won't be supported in Gradle 10
org.gradle.configuration-cache.unsafe.ignore.unsupported-build-events-listeners=true

# Compose Multiplatform auto-applies a hot-reload sub-plugin that breaks the configuration cache
# (it reads a sibling project's layout from the root project at configuration time). We don't use
# hot reload, so disable it.
org.jetbrains.compose.hot.reload.disable=true
