name: Format

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ktfmt:
    name: ktfmt
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17.0.21+9"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # A hard gate: `ktfmtCheck` aborts on the first unformatted file. Run `./gradlew
      # ktfmtFormatAll` locally before committing — the round-trip through CI costs more.
      - name: Check formatting
        run: ./gradlew ktfmtCheckAll

  # The native Swift player against the checked-in `.swift-format` (2-space indent, 100 columns).
  #
  # ADVISORY FOR NOW: without `--strict`, findings print as warnings and the step still passes, so
  # the output is a report rather than a gate. The existing sources predate the config and carry
  # findings — over-long lines among them — that no one has reformatted yet, and doing that here
  # would bury the change that introduced the lint. TODO(#398): clear the findings with
  # `swift format --in-place`, then add `--strict` so this becomes the hard gate ktfmt is. A file
  # that does not parse fails the step either way.
  #
  # The official toolchain image rather than whatever Swift the runner image carries, so the
  # formatter's version is chosen here and not by an image refresh.
  swift-format:
    name: swift-format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: swift:6.4-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint the native Swift player
        run: |
          swift format lint \
            --configuration .swift-format \
            --recursive \
            Sources/RcNativePlayerCore \
            Sources/RcNativePlayerUIKit \
            Tests/RcNativePlayerCoreTests \
            Tests/RcNativePlayerUIKitTests
