name: Snapshot

# Publishes `<next patch>-SNAPSHOT` of the five Maven artifacts on demand, so a consumer can pick up
# an unreleased fix without waiting for a release.
#
# Manual-only: there is deliberately no `push` trigger. Publishing a snapshot of every artifact on
# every merge to main was the bulk of this repository's Maven Central uploads, and nothing consumes
# them continuously. Run it from the Actions tab against the ref you want; compose-ai-tools'
# `snapshot.yml` made the same call. Restore the trigger by re-adding:
#
#   push:
#     branches: [main] The version comes from
# `ComposeAiMavenPublishingPlugin`, which derives it from `.release-please-manifest.json` when
# `PLUGIN_VERSION` is unset — so nothing here needs to know the number.
#
# Snapshots are NOT signed (the plugin only calls `signAllPublications()` for a non-SNAPSHOT
# version), which is why this job needs no signing secrets.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snapshot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish snapshots
    # macOS for the same reason `release.yml`'s `publish-maven` is: four of the five artifacts carry
    # iOS klibs, and those only build on a Mac. A Linux snapshot would ship KMP metadata with the
    # iOS variants missing.
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17.0.21+9"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: "true"
      # Read-only, like the Gradle User Home cache above: this job publishes, so it consumes the
      # remote cache but never writes it. The win is the iOS klibs, which CI's macOS lane compiles
      # for the same commit and writes to the cache; without this, each snapshot rebuilt them.
      - uses: ./.github/actions/buildfetch-cache
        with:
          ro-token: ${{ secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN_RO }}
          read-only-by-design: 'true'
      - name: Select an Xcode with the iOS 26 SDK
        run: |
          set -euo pipefail
          xcode="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$xcode" ]; then
            echo "No Xcode 26 on this image; Compose Multiplatform's iOS targets need its SDK." >&2
            exit 1
          fi
          sudo xcode-select --switch "$xcode/Contents/Developer"
      # Skip rather than fail when the credentials are absent. A snapshot is a convenience, not a
      # gate: on the first push to this repository the job compiled every iOS klib and then died on
      # an HTTP 401 from Sonatype, which reports a missing credential as a red main build. Nothing
      # is wrong with the tree in that case, and a red main teaches people to ignore red mains.
      # `release.yml` takes the opposite line, correctly — there a missing credential is fatal.
      - name: Check whether publishing credentials are configured
        id: creds
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
        run: |
          if [ -n "${MAVEN_CENTRAL_USERNAME:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No MAVEN_CENTRAL_USERNAME configured — skipping the snapshot publish."
          fi
      - name: Publish snapshots
        if: ${{ steps.creds.outputs.configured == 'true' }}
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        # RETRIED ONCE, and with a longer socket timeout than Gradle's 30s default. The upload is a
        # long series of POMs, jars and klibs over one connection to Sonatype, and a single "Read
        # timed out" partway through fails the whole task and reds main for a reason that has
        # nothing to do with the tree (run 34107401096). Re-publishing a -SNAPSHOT coordinate is
        # idempotent — snapshots are overwritable by definition — so a retry costs time and nothing
        # else. Two attempts, then the failure is real.
        run: |
          set -euo pipefail
          publish() {
            ./gradlew publishPlayers \
              -Dorg.gradle.internal.http.socketTimeout=120000 \
              -Dorg.gradle.internal.http.connectionTimeout=60000
          }
          publish || {
            echo "::warning title=Snapshot publish retry::The first publish attempt failed; retrying once before failing the job."
            sleep 30
            publish
          }
