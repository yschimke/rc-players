name: Release

# Publishes the players for a given tag: the five Maven artifacts to Maven Central, the Wasm bundle
# to npm and onto the GitHub Release (`rc-player-wasm.zip`, which is how a Gradle build gets it), and
# the Apple XCFramework plus native UIKit package onto the GitHub Release, with `Package.swift`
# rewritten to describe the shared binary framework, and the macOS and Linux desktop viewers.
#
# Entry points:
#   - workflow_call: called from release-please.yml after release-please merges the release PR and
#     creates the tag + Release. Primary path.
#   - workflow_dispatch: re-run the release build for an existing tag (e.g. after a transient
#     publish failure).
#   - push: tags (v*): escape hatch for manually-pushed tags.
#
# All three resolve to `TAG_NAME`, so the jobs don't care which fired.
on:
  workflow_call:
    inputs:
      tag:
        description: "Tag name to release (e.g. v0.2.0)."
        required: true
        type: string
    # Not `required: true`: a required secret that is not configured fails the *caller* at startup,
    # with no job and no message naming it. The preflight step in `publish-maven` reports the same
    # condition as an ordinary, readable failure instead.
    secrets:
      MAVEN_CENTRAL_USERNAME: { required: false }
      MAVEN_CENTRAL_PASSWORD: { required: false }
      SIGNING_KEY: { required: false }
      SIGNING_KEY_ID: { required: false }
      SIGNING_KEY_PASSWORD: { required: false }
      # Read-only: the Apple job loads the release links main's push already stored.
      BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN_RO: { required: false }
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to (re)release, e.g. v0.2.0. Must already exist."
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

# Both tag-push and workflow_call/dispatch for the same tag serialize through the same group, so a
# re-run can't race a fresh release.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

# Every job consumes TAG_NAME (never GITHUB_REF_NAME) so the steps work the same whether triggered
# by tag push or by workflow_call/dispatch. Templated once here; scripts read it via `$TAG_NAME`
# from the env, which keeps tag content out of shell arg positions.
env:
  TAG_NAME: ${{ inputs.tag || github.ref_name }}

jobs:
  # The Maven artifacts: rc-player-{trace,protocol,runtime,compose} and the vendored Android player.
  #
  # macOS, not Linux: `rc-player-compose` and its three siblings publish Apple klibs, and those only
  # build on a Mac. A Linux publish would silently ship a KMP module whose Apple variants are missing
  # from the Gradle module metadata — resolvable on JVM, broken on iOS, and only discovered by a
  # consumer.
  publish-maven:
    name: Publish to Maven Central
    runs-on: macos-26
    timeout-minutes: 120
    env:
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG_NAME }}
          persist-credentials: false
          # Full history, because the publish plan below compares each module against the tag IT
          # last published at. With the default shallow clone those tags are absent, the plan takes
          # its fail-safe path and marks every module dirty — a release that publishes everything
          # while reporting success, which is the saving silently turning itself off.
          fetch-depth: 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17.0.21+9"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: "true"

      # `ComposeAiMavenPublishingPlugin` reads this; without it the version falls back to the next
      # patch `-SNAPSHOT` derived from `.release-please-manifest.json`, which is right for local
      # builds and wrong for a release.
      - name: Derive version from tag
        run: echo "PLUGIN_VERSION=${TAG_NAME#v}" >> "$GITHUB_ENV"

      - name: Select an Xcode with the iOS 26 SDK
        run: |
          set -euo pipefail
          xcode="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$xcode" ]; then
            echo "No Xcode 26 on this image; Compose Multiplatform's iOS targets need its SDK." >&2
            exit 1
          fi
          sudo xcode-select --switch "$xcode/Contents/Developer"

      # Fail here, by name, rather than 25 minutes later on an HTTP 401 from Sonatype — which is how
      # this repository's first snapshot run reported the same condition, after compiling every iOS
      # klib first. Publishing is the last step of a long build; a missing credential should not cost
      # the whole build to discover.
      - name: Check the publishing credentials are configured
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -uo pipefail
          missing=()
          for name in MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD \
            SIGNING_KEY SIGNING_KEY_ID SIGNING_KEY_PASSWORD; do
            [ -n "${!name:-}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -ne 0 ]; then
            printf '::error::Publishing secrets are not configured on this repository\n'
            printf 'Missing: %s\n' "${missing[*]}" >&2
            echo "Add them under Settings -> Secrets and variables -> Actions." >&2
            exit 1
          fi
          echo "All five publishing secrets are present."

      # Which of the eight coordinates this release actually uploads.
      #
      # `maven-publish-plan.sh` compares each module's inputs against the tag it last published at,
      # propagates to dependents, and resolves every uncertainty to "publish": Central refuses a
      # second upload of a version, so an unnecessary publish costs quota while a wrongly-skipped
      # one is unrepairable. Over v1.54.0..v1.63.0 these rules would have published 57 of 152
      # module-publications.
      #
      # A module's inputs are its own directory plus every project in its transitive dependency
      # closure, unpublished ones included, and any directory outside its own that it packages
      # (#512): `remote-compose-player-js-dist` republishes when `third_party/remote-compose-player/`
      # changes. `.github/scripts/test-maven-publish-plan.sh`
      # holds those rules to fixtures in CI.
      #
      # Only the `workflow_call` path gets a plan. A `workflow_dispatch` or a manually pushed tag
      # is a recovery route whose baseline may not be trustworthy — that is usually why someone is
      # using it — and publishing everything is the safe answer there. An EMPTY set from a plan
      # that DID run is a different thing, and the two must not collapse: it means "upload
      # nothing", the right answer for a releasable change confined to `.github/` or the docs.
      # Not even the BOM — it would name exactly what the previous one did (#5532 upstream).
      #
      # `github.event_name` cannot express that condition: in a called workflow it carries the
      # CALLER's event, which for `release-please.yml` is `push`. Testing it against
      # `workflow_call` was therefore false on the one path that is supposed to plan, and v1.64.0
      # published nothing while reporting the fallback as normal. `inputs.tag` is the honest
      # signal — set by `workflow_call` and by `workflow_dispatch`, empty for a tag push — so the
      # two recovery routes are excluded by naming `workflow_dispatch` explicitly.
      - name: Compute the publish plan
        run: |
          set -euo pipefail
          PUBLISH_SET=""
          PUBLISH_PLANNED=false
          if [ -n "${{ inputs.tag }}" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            # `--write-manifest` puts the baseline the plan resolved from Central into the
            # workspace, where the Gradle build reads it to give a skipped module the version it
            # is already published at. Written, never committed.
            PUBLISH_SET="$(.github/scripts/maven-publish-plan.sh --head "$TAG_NAME" \
              --write-manifest publishing-manifest.json | paste -sd, -)"
            PUBLISH_PLANNED=true
          fi
          echo "plan ran: $PUBLISH_PLANNED; publish set: ${PUBLISH_SET:-<empty>}"
          echo "PUBLISH_SET=$PUBLISH_SET" >> "$GITHUB_ENV"
          echo "PUBLISH_PLANNED=$PUBLISH_PLANNED" >> "$GITHUB_ENV"

      # `publishPlayers` (root build) names the publishing projects explicitly, so a module that
      # does not publish can never be swept in by task-name matching — and it now filters them by
      # the plan. `:bom` goes up whenever any module does, and not at all on an empty plan.
      - name: Publish
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "$PUBLISH_PLANNED" = "true" ] && [ -z "$PUBLISH_SET" ]; then
            echo "no Maven artifacts changed; skipping Central publication"
            exit 0
          fi
          PLAN_ARGS=()
          if [ "$PUBLISH_PLANNED" = "true" ]; then
            PLAN_ARGS+=("-Pcomposeai.publishSet=$PUBLISH_SET")
          fi
          # `${PLAN_ARGS[@]+...}` rather than a bare `${PLAN_ARGS[@]}`: this job runs on macOS,
          # whose /bin/bash is 3.2, and there an EMPTY array under `set -u` expands as an unbound
          # variable and kills the step. That is how v1.64.0 died — before Gradle started, with
          # every other job of the release already green.
          ./gradlew publishPlayers -Pcomposeai.reproducibleKlibs=true ${PLAN_ARGS[@]+"${PLAN_ARGS[@]}"}

  # The Wasm bundle, published to npm so a web consumer can drop the player into a page without
  # cloning this repo and running Gradle.
  #
  # `rcPlayerNpmPackage` only *stages* the directory; `npm` runs here and nowhere else. Keeping Node
  # out of the Gradle build is a deliberate constraint (docs/design/RC_CMP_WASM_PLAYER.md).
  publish-wasm-player:
    name: Publish the Wasm player to npm
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG_NAME }}
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17.0.21+9"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: "true"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Upgrade npm (OIDC trusted publishing needs >= 11.5.1)
        run: npm install -g npm@latest

      # The size budget in `wasmPlayerDist` is the gate in front of an irreversible publish: npm
      # refuses to overwrite a version, so a bundle that ballooned would have to be superseded.
      - name: Stage the npm package
        run: ./gradlew :rc-player-wasm:rcPlayerNpmPackage

      - name: Set version from the tag
        working-directory: rc-player/wasm/build/npmPackage
        # The committed version is a 0.0.0 placeholder. Read from $TAG_NAME in the env rather than
        # templating it, so a tag name cannot inject arguments.
        run: npm version --no-git-tag-version --allow-same-version "${TAG_NAME#v}"

      - name: Publish
        env:
          IS_RECOVERY: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: rc-player/wasm/build/npmPackage
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          if npm view "@yschimke/remote-compose-player-cmp@${version}" version >/dev/null 2>&1; then
            echo "skip @yschimke/remote-compose-player-cmp@${version} (already published)"
            exit 0
          fi
          flags=(--access public)
          if [ "${IS_RECOVERY}" = "true" ]; then
            flags+=(--provenance=false)
            echo "recovery publish: provenance disabled (ref does not name the built tree)"
          fi
          npm publish "${flags[@]}"

  # The Wasm bundle as a Release asset, `rc-player-wasm.zip`. This is how a Gradle build gets the
  # player: compose-preview-server resolves it through an ivy repository over this repository's
  # release downloads, and design-parity's CI downloads it the same way. It used to go to Maven
  # Central as well, as `rc-player-wasm-dist`, about 11 MB of the org's monthly Central release-size
  # limit per release, for a bundle nothing compiles against.
  #
  # A job of its own, not a step of the npm job: that job is `continue-on-error`, and a release
  # missing this asset breaks every consumer pinned to that version. The asset name carries no
  # version and must not change, so every release since the first stays resolvable by one pattern.
  attach-wasm-bundle:
    name: Attach the Wasm bundle to the Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # `gh release upload` mutates the Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG_NAME }}
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17.0.21+9"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: "true"
      # `wasmPlayerDist` enforces the bundle's size budget, so a bundle that ballooned fails here
      # rather than reaching consumers.
      - name: Build the bundle
        run: ./gradlew :rc-player-wasm:wasmPlayerDist
      - name: Attach the bundle to the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          (cd rc-player/wasm/build/wasmDist && zip -qr "$RUNNER_TEMP/rc-player-wasm.zip" .)
          test -n "$(unzip -Z1 "$RUNNER_TEMP/rc-player-wasm.zip" index.html)"
          gh release upload "$TAG_NAME" "$RUNNER_TEMP/rc-player-wasm.zip" --clobber

  # The Linux desktop viewer (`rc-player/desktop`): the CMP player in a window, the JVM counterpart
  # of the macOS app the Apple job attaches. Two assets, both bundling a JRE: a `.deb` and a
  # self-contained `tar.gz`. Asset names carry no version, as with the Wasm bundle, so a download
  # link is one pattern across releases. Independent of Maven Central: a viewer for a release that
  # failed to publish its artifacts is still a viewer for that tag's source.
  attach-linux-viewer:
    name: Attach the Linux desktop viewer to the Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # `gh release upload` mutates the Release
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG_NAME }}
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17.0.21+9"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: "true"
      # jpackage's DEB bundler shells out to `fakeroot` and `dpkg-deb`, and silently skips the
      # bundle ("configuration problem") when either is missing.
      - name: Install the .deb tooling
        run: sudo apt-get install -y --no-install-recommends fakeroot
      - name: Build the viewer
        run: ./gradlew :rc-player-desktop:packageRcDesktopLinux -Prc.desktop.version="${TAG_NAME#v}"
      # The packaged launcher, not the Gradle classpath — what a user unpacks — and the version it
      # was stamped with. ci.yml runs the same check on every PR.
      - name: Smoke-test the packaged viewer
        run: |
          set -euo pipefail
          scripts/check-linux-viewer.sh "${TAG_NAME#v}"
          (cd rc-player/desktop/build/rc-desktop-dist &&
            for f in *.deb *.tar.gz; do sha256sum "$f" > "$f.sha256"; done)
      - name: Attest the viewer
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            rc-player/desktop/build/rc-desktop-dist/RemoteComposePlayer-linux-amd64.deb
            rc-player/desktop/build/rc-desktop-dist/RemoteComposePlayer-linux-x64.tar.gz
      - name: Attach the viewer to the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          dist=rc-player/desktop/build/rc-desktop-dist
          gh release upload "$TAG_NAME" \
            "$dist/RemoteComposePlayer-linux-amd64.deb" \
            "$dist/RemoteComposePlayer-linux-amd64.deb.sha256" \
            "$dist/RemoteComposePlayer-linux-x64.tar.gz" \
            "$dist/RemoteComposePlayer-linux-x64.tar.gz.sha256" \
            --clobber

  # macOS-only: the Kotlin/Native linker, XCFramework tooling, and native UIKit package validation
  # all need it.
  publish-xcframework:
    name: Publish the Apple XCFramework
    # Enabled again. This job was gated off while the Kotlin/Native release link
    # (`linkReleaseFramework{IosArm64,IosSimulatorArm64}`, via `rcPlayerXcframeworkChecksum`) ran
    # out of heap on `macos-15`; the cause was that Kotlin/Native compiles inside the Gradle
    # daemon's JVM, which was capped at 2 GB, while the 4 GB nominally granted by
    # `kotlin.native.jvmArgs` went to an out-of-process compiler this build never starts. See
    # `gradle.properties` for the full account.
    #
    # The re-enable conditions from that gate are both met: `org.gradle.jvmargs` now sizes the JVM
    # that actually links, and `ci.yml` runs this same task on every PR — so the link is proven on
    # the pull request before a release ever depends on it, which is the evidence the old comment
    # asked for.
    needs: [publish-maven]
    runs-on: macos-26
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The released source, so the binary matches the tag it is attached to — and so the bare
          # Swift tag below is parented on exactly this commit. `persist-credentials` is what lets
          # that tag be pushed; nothing here pushes a branch.
          ref: ${{ env.TAG_NAME }}
          persist-credentials: true
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17.0.21+9"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: "true"
      # Main's push of this same commit linked the release frameworks and stored them in the remote
      # cache (`ComposeAiBaseConventionsPlugin` keeps release links cacheable), so with read access
      # this job loads them instead of spending 20-30 minutes linking again. Read-only: a release
      # never writes the cache.
      - uses: ./.github/actions/buildfetch-cache
        with:
          ro-token: ${{ secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN_RO }}
          read-only-by-design: "true"
      - name: Derive version from tag
        run: |
          echo "PLUGIN_VERSION=${TAG_NAME#v}" >> "$GITHUB_ENV"
          echo "RC_NATIVE_UIKIT_SOURCE_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Select an Xcode with the iOS 26 SDK
        run: |
          set -euo pipefail
          xcode="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$xcode" ]; then
            echo "No Xcode 26 on this image; Compose Multiplatform's iOS targets need its SDK." >&2
            exit 1
          fi
          sudo xcode-select --switch "$xcode/Contents/Developer"
      # `--max-workers=1`: the three release links share the Gradle daemon's heap, so they must not
      # run `ModuleDFGBuilder` concurrently. Same invocation as `ci.yml`'s, deliberately.
      - name: Assemble the Apple release artifacts
        run: |
          ./gradlew \
            :rc-player-compose:rcPlayerXcframeworkChecksum \
            :rc-player-compose:rcNativePlayerUIKitPackageChecksum \
            --max-workers=1
      - name: Validate the native UIKit release package
        run: scripts/check-native-uikit-package.sh
      - name: Build the downloadable macOS player
        run: scripts/package-macos-player.sh
      - name: Build the rc-swift-render command-line renderer
        run: scripts/package-swift-render.sh
      - name: Attest the Apple release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            rc-player/compose/build/distributions/RcComposePlayer.xcframework.zip
            rc-player/compose/build/distributions/RcNativePlayerUIKit.swiftpackage.zip
            rc-player/compose/build/distributions/RcNativePlayerUIKit.profile.json
            build/distributions/RemoteComposePlayer-macOS-arm64.zip
            build/distributions/rc-swift-render-macos-arm64.zip
      - name: Upload the Apple artifacts to the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "$TAG_NAME" \
            rc-player/compose/build/distributions/RcComposePlayer.xcframework.zip \
            rc-player/compose/build/distributions/RcComposePlayer.xcframework.zip.sha256 \
            rc-player/compose/build/distributions/RcNativePlayerUIKit.swiftpackage.zip \
            rc-player/compose/build/distributions/RcNativePlayerUIKit.swiftpackage.zip.sha256 \
            rc-player/compose/build/distributions/RcNativePlayerUIKit.profile.json \
            rc-player/compose/build/distributions/RcNativePlayerUIKit.profile.json.sha256 \
            build/distributions/RemoteComposePlayer-macOS-arm64.zip \
            build/distributions/RemoteComposePlayer-macOS-arm64.zip.sha256 \
            build/distributions/rc-swift-render-macos-arm64.zip \
            build/distributions/rc-swift-render-macos-arm64.zip.sha256 \
            --clobber

      # The bare `X.Y.Z` tag is the whole deliverable — it is the only thing a Swift consumer
      # resolves, and it is a TAG, so it is written under `refs/tags/*` and never touches
      # `refs/heads/main`.
      #
      # This used to also push the rewritten `Package.swift` to `main`, and that push is what broke
      # every release: the `Protect Main` ruleset refuses a direct push ("Changes must be made
      # through a pull request"), `set -e` aborted the step, and the tag below — the part consumers
      # actually need — was never created. v1.58.1 and v1.59.0 both uploaded their XCFramework and
      # then stopped one line short of being resolvable.
      #
      # So the commit is no longer pushed to a branch at all. It is parented on the release tag and
      # published solely as the bare version tag; pushing a tag pushes the objects it references, so
      # the commit is reachable without ever being on `main`. `main`'s `Package.swift` therefore
      # stays on its placeholder by design — see the comment in that file. That is not a
      # regression: `main` never carried usable values, because a manifest cannot state the checksum
      # of an asset that does not exist yet.
      #
      # Parenting on the release tag rather than on `main` is also more honest than what this did
      # before. The bare `1.59.0` tag now contains exactly `v1.59.0`'s source plus the pointer to
      # `v1.59.0`'s asset, instead of whatever `main` had drifted to since. It removes the
      # re-release hazard the old code had to reason about: a `workflow_dispatch` re-release of an
      # older version can no longer write that older release's url over a newer `main`.
      #
      # Every step is idempotent, because `workflow_dispatch` re-releasing an existing tag is a
      # documented recovery path and the second run finds the work already done: the Swift tag
      # already exists and already describes this asset (the zip is built reproducibly, so the
      # checksum is the same bytes). A re-run must be a no-op, not a failure. A tag that exists but
      # points somewhere ELSE is still a hard error: that means the asset and the tag disagree,
      # which is the one thing this scheme exists to prevent.
      - name: Point Package.swift at the uploaded asset and tag it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          checksum="$(awk '{print $1}' rc-player/compose/build/distributions/RcComposePlayer.xcframework.zip.sha256)"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}/RcComposePlayer.xcframework.zip"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Bare `<version>`, which is what SwiftPM resolves: it only reads a tag as a semantic
          # version when the whole ref is `X.Y.Z` or `vX.Y.Z`.
          swift_tag="${PLUGIN_VERSION}"

          # THE EXISTING TAG IS CHECKED FIRST, before anything is written. A `workflow_dispatch`
          # re-release of an older version runs against a `main` that has since advanced, so
          # rewriting and pushing first would commit this release's (older) url and checksum over a
          # newer `Package.swift` and only then discover the tag was already there. Deciding from
          # the TAG's own `Package.swift` — not from `main`'s — is also what makes the idempotent
          # case honest. `--refs` drops the peeled `^{}` line, so a lightweight tag yields one SHA.
          existing="$(git ls-remote --refs --tags origin "refs/tags/${swift_tag}" | cut -f1)"
          if [ -n "$existing" ]; then
            git fetch --no-tags --depth 1 origin "$existing"
            tagged="$(git show "${existing}:Package.swift")"
            if printf '%s' "$tagged" | grep -qF "\"$url\"" &&
              printf '%s' "$tagged" | grep -qF "checksum: \"$checksum\""; then
              echo "tag ${swift_tag} already describes this asset; nothing to do"
              exit 0
            fi
            echo "tag ${swift_tag} exists at ${existing} but its Package.swift describes a" >&2
            echo "different asset than ${TAG_NAME}'s. Refusing to move it." >&2
            exit 1
          fi

          # HEAD is already $TAG_NAME — the `checkout` above pinned it — so the Swift tag is built
          # straight on the released source. No branch is involved and nothing is pushed to `main`.
          scripts/update-package-swift.sh "$url" "$checksum"
          if git diff --quiet -- Package.swift; then
            # Only reachable if the released source already carried these exact values, which the
            # placeholder never does. Tag HEAD as-is rather than failing on an empty commit.
            echo "Package.swift at ${TAG_NAME} already points at this asset; tagging it unchanged"
          else
            git add Package.swift
            git commit -m "chore(release): point Package.swift at ${TAG_NAME}"
          fi
          git tag "$swift_tag"
          # Explicit refspec: this writes refs/tags/* only, never refs/heads/*.
          git push origin "refs/tags/${swift_tag}"

          echo "Swift consumers can now resolve:"
          echo "  .package(url: \"https://github.com/${GITHUB_REPOSITORY}.git\", from: \"${swift_tag}\")"

      - name: Build the downloadable Simulator player
        # Assembled by an earlier step; a release must not quietly build its own framework.
        env:
          RC_APPLE_PLAYER_REQUIRE_FRAMEWORK: 1
        run: |
          set -euo pipefail
          scripts/package-apple-player.sh

      - name: Upload the Simulator player to the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$TAG_NAME" \
            build/distributions/RemoteComposePlayer-Simulator-arm64.zip \
            build/distributions/RemoteComposePlayer-Simulator-arm64.zip.sha256 \
            --clobber
