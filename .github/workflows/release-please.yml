name: Release PR

# Keeps a "chore(main): release X.Y.Z" pull request up to date from conventional-commit history
# since the last tag. When that PR is merged, release-please creates the tag and a draft GitHub
# Release, and this workflow hands the tag to `release.yml`.
#
# One button: merging the release PR triggers the full publish. No manual tag push, no dispatch
# step.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Ordinary main pushes share one pending slot so release-please PR updates coalesce during a merge
  # burst. A merged release PR must not share that slot: if it is still pending, the next main push
  # can replace it before any publish job starts.
  # Quoted: the `chore(main): release ` literal contains `: `, which YAML would otherwise read as a
  # nested mapping and reject the whole workflow at startup.
  group: "release-please-${{ github.ref }}-${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore(main): release ') && github.sha || 'updates' }}"
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create tags + GitHub Releases
      pull-requests: write # open/update the release PR
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      pr: ${{ steps.rp.outputs.pr }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  release:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    # `inherit`, not a five-line explicit map. Naming each secret at the call site makes the *call*
    # fail at startup when one is not configured — no job, no log, no indication of which secret is
    # missing. Inheriting lets the workflow start and fail at `publish-maven`'s preflight instead,
    # which names exactly what is absent. (That was not the cause of this repository's early
    # `startup_failure` runs — see the permissions note below — but it is still the better shape.)
    secrets: inherit
    # A called workflow CANNOT ELEVATE what its caller granted. This workflow's top-level
    # `permissions` is `contents: read`, and this job does not override it — so every job in
    # `release.yml` asking for `contents: write` (creating the Release, uploading assets, pushing the
    # `Package.swift` commit), `id-token: write` (OIDC), or `attestations: write` (release
    # provenance) asks for more than it was given, and the CALL fails at startup: no job, no log,
    # no cause.
    #
    # That is what `startup_failure` on this repository's first two Release PR runs actually was. It
    # survived the switch to `secrets: inherit` because the secrets were never the problem — this
    # block simply did not come across when the workflow was ported from compose-ai-tools, where it
    # has always been present and carries the same warning.
    permissions:
      contents: write
      id-token: write
      attestations: write
      # No `pull-requests: write`: `record-published` was the only job that wanted it, and it is
      # gone — the publish plan reads its baseline from Maven Central and writes nothing back.
      # Keep that true; by the rule above, a job asking for more than this block grants fails the
      # whole call at startup.

  # Which Maven coordinates merging the release PR would publish, as one comment on that PR. The
  # publish plan only runs inside the release, so the answer was visible only after the
  # irreversible upload. Same script, same Maven Central baseline, run against the release PR's
  # head; see `.github/scripts/release-pr-publish-plan.sh` (shared with compose-preview-daemon and
  # compose-ai-tools). Informational: it never fails, and a release run skips it because the
  # release has only just been cut and Central does not serve it yet.
  release-pr-publish-plan:
    needs: release-please
    if: ${{ !cancelled() && needs.release-please.result == 'success' && needs.release-please.outputs.release_created != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # create/edit the comment on the release PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Comment the publish plan on the release PR
        env:
          GH_TOKEN: ${{ github.token }}
          RP_PR: ${{ needs.release-please.outputs.pr }}
        run: ./.github/scripts/release-pr-publish-plan.sh
