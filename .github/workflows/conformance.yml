name: Conformance

# Scores each player against the AndroidX RemoteCompose conformance corpus and publishes the
# scorecard.
#
# **Scheduled, not per-push, and never gating.** Three reasons, in order of how much they matter:
#
#  1. The corpus is not in this repository's main line. It lives on the long-lived
#     `vendor/androidx-rc-conformance` branch, reconstructed from an *unmerged* AOSP Gerrit change
#     (see that branch's `third_party/rc-conformance-spec/PROVENANCE.md`). A pull request cannot be
#     blocked on an expectation set that upstream may revise without warning.
#  2. The score is a measurement, not a contract. Most of what it currently reports is this
#     runner's own observability gaps — probes the CMP player exposes no seam for — and gating on a
#     number that moves when the *runner* improves teaches people to ignore the gate.
#  3. A full run rebuilds a Compose scene per resize step across 252 golds. That is minutes of
#     wall clock nobody should pay on every push.
#
# What it is for: noticing that the number moved. A drop between two runs is either a player
# regression or an upstream corpus revision, and the artifact says which.

on:
  schedule:
    # 04:20 UTC daily — off the hour, so this does not pile onto the top-of-hour rush on GitHub's
    # shared scheduler, where jobs queue rather than run.
    - cron: "20 4 * * *"
  workflow_dispatch:
    inputs:
      spec_ref:
        description: "Branch or SHA carrying the conformance corpus"
        required: false
        default: "vendor/androidx-rc-conformance"
      filter:
        description: "Only golds whose name or category matches this (blank = the whole corpus)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  score:
    name: Score ${{ matrix.player }}
    # Linux is enough for both JVM lanes: `ImageComposeScene` rasterizes through skiko's software
    # path with no display server, which is the same property `:rc-player-profile` relies on. The
    # Apple and Wasm lanes will need their own hosts when they arrive; they are not here yet.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # One red lane must not cancel the others: the point of the matrix is the comparison between
      # them, and a partial scorecard is worth more than none.
      fail-fast: false
      matrix:
        # Two lanes, and the second is why the first is interpretable: the corpus was generated by
        # AndroidX, so a gold both lanes fail says something very different from one only the CMP
        # player fails. See docs/design/RC_CONFORMANCE.md.
        player: [cmp, androidx-jvm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The corpus, checked out beside the source tree rather than into it. Keeping it out of the
      # working tree is what stops it being committed here by accident, which is the failure mode
      # `PLAYER_IMPLEMENTATION_GUIDE.md` §1 warns about: a copy drifts the first time a gold is
      # regenerated, and the drift is silent because the runner keeps passing against it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.spec_ref || 'vendor/androidx-rc-conformance' }}
          path: conformance-spec
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17.0.20+101"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: "true"

      - name: Confirm the corpus is really there
        id: corpus
        run: |
          set -euo pipefail
          spec="$GITHUB_WORKSPACE/conformance-spec/third_party/rc-conformance-spec/compose/remote/specification/conformance"
          # An absent corpus and a player that renders nothing produce the same zero. Failing here,
          # loudly, is the difference between "the score dropped" and "nobody measured anything".
          if [ ! -d "$spec/gold" ]; then
            echo "::error::no gold corpus at $spec/gold — is vendor/androidx-rc-conformance still carrying it?"
            exit 1
          fi
          golds="$(find "$spec/gold" -name '*.gold.json' | wc -l | tr -d ' ')"
          echo "corpus: $golds golds"
          echo "spec=$spec" >> "$GITHUB_OUTPUT"
          echo "golds=$golds" >> "$GITHUB_OUTPUT"

      - name: Score
        run: |
          ./gradlew --no-daemon :rc-conformance:conformance \
            -Prc.player=${{ matrix.player }} \
            -Prc.specDir='${{ steps.corpus.outputs.spec }}' \
            -Prc.filter='${{ github.event.inputs.filter }}'

      - name: Summarise
        if: always()
        run: |
          set -euo pipefail
          card=rc-conformance/build/conformance/scorecard.md
          if [ -f "$card" ]; then
            # Into the log as well: a step summary is not readable through the API, and a branch
            # dispatch publishes nothing else.
            tee -a "$GITHUB_STEP_SUMMARY" < "$card"
          else
            echo "The run produced no scorecard — see the job log." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: conformance-${{ matrix.player }}
          # `conformance-results.json` is the file the corpus's own player-agnostic report
          # generators consume — `node generate-audit-report.mjs --player cmp` turns it into the
          # visual audit. Keeping it as an artifact is what makes that possible after the fact.
          path: rc-conformance/build/conformance/
          retention-days: 30
          if-no-files-found: warn

  score-apple:
    name: Score native-appkit
    # The one lane that cannot share the Linux runner. It drives the packaged macOS player as a
    # subprocess, which needs a Mac -- but deliberately not a simulator: the AppKit host renders the
    # same native Swift core, and booting, installing and launching a simulator per gold would cost
    # more than the whole rest of this workflow.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.spec_ref || 'vendor/androidx-rc-conformance' }}
          path: conformance-spec
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17.0.20+101"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: "true"

      - name: Confirm the corpus is really there
        id: corpus
        run: |
          set -euo pipefail
          spec="$GITHUB_WORKSPACE/conformance-spec/third_party/rc-conformance-spec/compose/remote/specification/conformance"
          if [ ! -d "$spec/gold" ]; then
            echo "::error::no gold corpus at $spec/gold — is vendor/androidx-rc-conformance still carrying it?"
            exit 1
          fi
          echo "spec=$spec" >> "$GITHUB_OUTPUT"

      # `package-macos-player.sh` does *not* build the framework it packages -- it asserts one is
      # already there and exits if not. `ci.yml` assembles first for the same reason; without this
      # step the job below fails with "expected a locally assembled macOS framework".
      #
      # `--max-workers=1` is the Apple link's own limit rather than this repository's automation
      # policy: Kotlin/Native compiles inside the Gradle daemon's JVM, so parallel release links
      # peak together in one heap.
      - name: Assemble the release XCFramework
        run: ./gradlew --no-daemon :rc-player-compose:assembleRcComposePlayerReleaseXCFramework --max-workers=1

      # The lane shells out to this binary. Building it here rather than depending on another job
      # keeps the lane self-contained, and it is the same script the Apple CI job already runs.
      - name: Build the macOS player
        run: scripts/package-macos-player.sh

      - name: Score
        run: |
          ./gradlew --no-daemon :rc-conformance:conformance \
            -Prc.player=native-appkit \
            -Prc.specDir='${{ steps.corpus.outputs.spec }}' \
            -Prc.filter='${{ github.event.inputs.filter }}'

      - name: Summarise
        if: always()
        run: |
          set -euo pipefail
          card=rc-conformance/build/conformance/scorecard.md
          if [ -f "$card" ]; then
            # Into the log as well: a step summary is not readable through the API, and a branch
            # dispatch publishes nothing else.
            tee -a "$GITHUB_STEP_SUMMARY" < "$card"
          else
            echo "The run produced no scorecard — see the job log." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: conformance-native-appkit
          path: rc-conformance/build/conformance/
          retention-days: 30
          if-no-files-found: warn

  publish:
    name: Publish the report
    needs: [score, score-apple]
    # `always()` so a red lane still gets a report — a missing lane is rendered as *not measured*,
    # which is a different statement from a zero and the one the reader needs. Only `main`
    # publishes: a dispatch on a branch measures that branch, and must not replace the day's run.
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # The only job here that writes. `reports/conformance` is an orphan branch carrying reports
      # and nothing else, so this cannot touch source, and the branch is excluded from the release
      # tooling for the same reason `vendor/androidx-rc-conformance` is.
      contents: write
    steps:
      - name: Check out the report generator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      # For `results/typescript/` — upstream's own run, which the report uses as a reference lane.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.spec_ref || 'vendor/androidx-rc-conformance' }}
          path: conformance-spec
          persist-credentials: false

      - name: Check out the report branch
        run: |
          set -euo pipefail
          git fetch origin reports/conformance --depth=1 || true
          if git rev-parse --verify origin/reports/conformance >/dev/null 2>&1; then
            git worktree add report origin/reports/conformance
            git -C report checkout -B reports/conformance
          else
            # First run, or someone deleted it. An orphan rather than a branch off main: the report
            # tree shares no history with the source and must never carry a copy of it.
            git worktree add --detach report
            git -C report checkout --orphan reports/conformance
            git -C report rm -rf --quiet . || true
          fi

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: conformance-*

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0

      - name: Render
        run: |
          set -euo pipefail
          # The subject lane comes first, and that ordering is what the cross-lane split is computed
          # from. `--reference` says which of the others that split may use: `native-appkit` is
          # scored beside them but is not a credible reference for it, because a lane that fails
          # nearly every frame marks every subject failure as shared and leaves nothing to act on.
          spec="$GITHUB_WORKSPACE/conformance-spec/third_party/rc-conformance-spec/compose/remote/specification/conformance"
          # `typescript` is upstream's own run, shipped with the corpus. It is the best reference
          # this repository has: an independent implementation, scored by the runner that generated
          # the golds, so a gold it passes and `cmp` fails cannot be blamed on the expectation.
          node scripts/conformance-report/render-report.mjs \
            --out report \
            --reference androidx-jvm \
            --reference typescript \
            --run-id "$(date -u +%Y-%m-%d)" \
            --commit "${{ github.sha }}" \
            --ref "${{ github.ref_name }}" \
            cmp=artifacts/conformance-cmp/conformance-results.json \
            androidx-jvm=artifacts/conformance-androidx-jvm/conformance-results.json \
            native-appkit=artifacts/conformance-native-appkit/conformance-results.json \
            typescript="$spec/results/typescript/conformance-results.json"
          cat report/README.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish
        run: |
          set -euo pipefail
          cd report
          git add -A
          # Nothing to say is a normal outcome — a re-run on the same day against the same commit
          # produces byte-identical output — and must not fail the job.
          if git diff --cached --quiet; then
            echo "the report is unchanged; nothing to publish"
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "report: conformance run $(date -u +%Y-%m-%d)"
          git push origin reports/conformance

  site:
    name: Publish the site
    needs: [score, score-apple]
    # A red lane must not cost the site: the index renders a lane with no results as *not measured*,
    # which is the statement a reader needs, and the other lanes' reports are still worth having.
    # Branch dispatches stop at the scored artifacts, as `publish` does.
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # `deploy-pages` needs both, and nothing here writes to the repository. The Markdown reports
      # are the `publish` job's business; this one only ever produces a Pages artifact.
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The site generators ship *with the corpus*, not with this repository. They are
      # player-agnostic -- `generate-audit-report.mjs` renders whatever results it is handed and
      # takes the player's name from the file -- which is why the corpus is checked out here too.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.spec_ref || 'vendor/androidx-rc-conformance' }}
          path: conformance-spec
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          pattern: conformance-*

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2

      - name: Render a report per player
        run: |
          set -euo pipefail
          spec="$GITHUB_WORKSPACE/conformance-spec/third_party/rc-conformance-spec/compose/remote/specification/conformance"
          mkdir -p site
          lanes=()
          for player in cmp androidx-jvm native-appkit; do
            results="artifacts/conformance-$player/conformance-results.json"
            lanes+=("$player=$results")
            # A lane whose job failed has no results file. Skipping the generator here is what makes
            # the index say *not measured* instead of showing a player that passes nothing.
            if [ ! -f "$results" ]; then
              echo "::warning::no results for $player; the index will report it as not measured"
              continue
            fi
            mkdir -p "site/$player"
            # Not fatal. Under `set -e` one player's generator failing would take the whole site
            # with it, and three players' reports are worth more than none -- the index already has
            # a shape for a lane it has nothing for.
            if ! node "$spec/generate-audit-report.mjs" --results "$results" --out "site/$player"; then
              echo "::warning::the audit generator failed for $player; its pages will be missing"
              rm -rf "site/$player"
            fi
          done

          # A fourth player, for free. The corpus ships upstream's own TypeScript run under
          # `results/typescript/`, in the same schema the generators read -- so it is a column this
          # repository gets without measuring anything. It is *reported by upstream* rather than
          # measured here, which is why the index labels it so, and it is the only external number
          # these scores can be checked against.
          typescript="$spec/results/typescript/conformance-results.json"
          if [ -f "$typescript" ]; then
            mkdir -p site/typescript
            if node "$spec/generate-audit-report.mjs" --results "$typescript" --out site/typescript
            then
              lanes+=("typescript=$typescript")
            else
              echo "::warning::the audit generator failed for typescript"
              rm -rf site/typescript
            fi
          else
            echo "::warning::the corpus carries no typescript results; skipping that column"
          fi
          # Corpus-level, so once rather than per player: it describes the golds, not a player.
          if ! node "$spec/generate-gold-overview.mjs" --out site; then
            echo "::warning::the gold overview failed to render; the index will link a missing page"
          fi
          node scripts/conformance-report/render-site-index.mjs \
            --out site \
            --run-id "$(date -u +%Y-%m-%d)" \
            --commit "${{ github.sha }}" \
            "${lanes[@]}"
          # The index is the one page that must exist: without it Pages serves a directory listing.
          test -f site/index.html
          du -sh site

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
