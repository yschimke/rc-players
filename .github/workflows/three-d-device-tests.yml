name: 3D device tests

# The `android.graphics.Mesh` renderer in `:rc-player-3d` draws only on a device (API 34+):
# Robolectric's host graphics have no meshes. This runs `Rc3DAndroidMeshDeviceTest` on an API 34
# emulator, which compares the mesh path with the CPU-transformed vertex path on a real hardware
# canvas, and publishes the renders it compared. See docs/design/RC_3D_EXTENSION.md.

on:
  pull_request:
    paths:
      - 'rc-player/three-d/**'
      - '.github/workflows/three-d-device-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: three-d-device-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  device-tests:
    name: Mesh renderer (API 34 emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17.0.21+9"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: ./.github/actions/buildfetch-cache
        with:
          rw-token: ${{ github.event_name == 'push' && secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN || '' }}
          ro-token: ${{ secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN_RO }}
      - name: Build the test APK before booting
        run: ./gradlew --stacktrace :rc-player-3d:assembleAndroidDeviceTest
      - name: Run the device tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disk-size: 4G
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # The renders are pulled whether or not the tests pass: a failure is read from them.
          script: |
            ./gradlew --stacktrace :rc-player-3d:connectedAndroidDeviceTest || echo "TESTS_FAILED" > device-tests-failed
            mkdir -p rc3d-mesh && for d in $(adb shell 'ls -d /sdcard/Android/data/*/files/rc3d-mesh 2>/dev/null' | tr -d '\r'); do adb pull "$d/." rc3d-mesh/; done
            find rc-player/three-d/build/outputs/androidTest-results -name '*.xml' -exec grep -h -A6 '<failure' {} + || true
            adb logcat -d | grep -iE 'Rc3D|Mesh|SkSL|AndroidRuntime|TestRunner' | tail -n 200 || true
            test ! -f device-tests-failed
      # The renders as a base64 tarball in the log, for readers that can reach job logs but not
      # artifacts.
      - name: Print the renders
        if: always()
        run: |
          echo "RC3D-MESH-BEGIN"
          tar czf - rc3d-mesh 2>/dev/null | base64 -w 0 || true
          echo
          echo "RC3D-MESH-END"
      - name: Upload the renders
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rc3d-mesh-renders
          path: rc3d-mesh/**
          if-no-files-found: warn
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rc3d-device-test-results
          path: |
            rc-player/three-d/build/outputs/androidTest-results/**
            rc-player/three-d/build/reports/androidTests/**
          if-no-files-found: warn
