name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A pull request collapses per branch: a new push supersedes the run it replaces, because only the
# latest state of a branch is worth a runner.
#
# A PUSH TO MAIN GETS A GROUP OF ITS OWN, per commit. Every main run used to share
# `CI-refs/heads/main`, and a group holds ONE run and ONE pending run: a third arrival does not
# queue behind the other two, it cancels the one that was waiting. With a 45-70 minute Apple lane
# and merges arriving faster than that, commits were not being verified late — they were not being
# verified at all. On 16 Sep the runs for `1e03fb6` and `2d968c4` were both cancelled that way, and
# `2d968c4` was the commit that first carried the catalog corpus score.
#
# Serialising never saved a runner minute either. Six merges cost six runs' worth of macOS time
# whether they overlap or not; sharing a group only decided when it was spent, and which commits
# got skipped. `cancel-in-progress: true` is the same trade taken further, not a fix for it.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref
    }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What in the macOS lane is worth its minutes on this change. It used to gate the *whole* lane,
  # which quietly made it the gate on all Kotlin/Native and wasm test execution: a change confined
  # to `rc-player/wasm`, `rc-player/metrics`, `rc-player/profile`, `rc-player/compat-tests` or
  # `third_party/` matched nothing here and shipped without a single non-JVM test running (#77).
  # The expensive half was never the tests — it is the XCFramework link, the Swift type check and
  # the Xcode packaging — so those are what this gates now, step by step below, and the tests and
  # the ABI gate run on every pull request.
  #
  # Keep the list here (rather than a third-party path-filter action) so the exact trust boundary is
  # visible and changes to this workflow always exercise the lane once before changing its own gate.
  #
  # `Sources` is the Swift overlay, and the whole directory rather than the one target in it: the
  # `RcComposePlayerSwiftUI` target declares no `path`, so SwiftPM takes `Sources/<target name>` and
  # any target added later lands here too. `Package.swift` above does not stand in for it — adding a
  # file to an existing target changes what ships without changing the manifest. It has to be gated
  # because the two steps that ever compile it are gated: `check-swift-sample.sh` builds
  # `Sources/RcComposePlayerSwiftUI/*.swift` directly, and the sample Xcode project
  # `package-apple-player.sh` builds references the same files. Left out, a change confined to the
  # overlay met neither, and an overlay that does not compile — or no longer matches the
  # framework — could reach SwiftPM consumers with both Apple checks skipped (#69).
  apple-changes:
    name: Apple packaging changes
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.filter.outputs.required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check whether the Apple lane is required
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          required=true
          if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null && \
            git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
              .github/workflows/ci.yml \
              .github/workflows/release.yml \
              Package.swift \
              Sources \
              Tests/RcNativePlayerCoreTests \
              Tests/RcNativePlayerUIKitTests \
              distribution/native-uikit \
              build.gradle.kts \
              settings.gradle.kts \
              gradle.properties \
              gradle \
              gradlew \
              gradlew.bat \
              build-logic \
              rc-player/trace \
              rc-player/protocol \
              rc-player/runtime \
              rc-player/compose \
              samples/apple-player \
              samples/macos-player \
              scripts/build-apple-player.sh \
              scripts/build-macos-player.sh \
              scripts/check-apple-player-screenshot.sh \
              scripts/check-native-uikit-accessibility-ui.sh \
              scripts/check-native-uikit-accessibility-simulator.sh \
              scripts/check-native-uikit-animation-simulator.sh \
              scripts/check-native-uikit-comparison.sh \
              scripts/measure-native-appkit.sh \
              scripts/measure-native-swift-core.sh \
              scripts/check-native-swift-fuzz.sh \
              scripts/check-native-swift-ios-tests.sh \
              scripts/measure-native-uikit-simulator.sh \
              scripts/measure-apple-players-macos.sh \
              scripts/native-uikit-comparison \
              scripts/check-native-uikit-package.sh \
              scripts/check-native-uikit-profile.sh \
              scripts/check-swift-sample.sh \
              scripts/package-apple-player.sh \
              scripts/package-macos-player.sh \
              scripts/render-native-uikit-lane.sh \
              scripts/simulator-boot.sh \
              scripts/check-native-uikit-corpus.sh \
              scripts/rc-catalog-corpus \
              scripts/set-apple-player-package-version.sh \
              scripts/update-package-swift.sh \
              scripts/validate-apple-player-screenshot.swift \
              scripts/validate-native-uikit-animation.swift \
              docs/design/RC_PLAYER_SWIFT.md
          then
            required=false
          fi
          echo "required=$required" | tee -a "$GITHUB_OUTPUT"

  # The pure-Swift document core on Linux. It imports Foundation alone, so the one part of the native
  # player that every Apple host sits on can be tested on the cheap lane, in minutes, instead of
  # only behind the macOS job's packaging gate. Off Apple platforms `Package.swift` declares only
  # `RcNativePlayerCore` and `RcNativePlayerCoreTests`, so nothing here resolves the XCFramework or
  # compiles a UIKit/AppKit/CoreGraphics target. The fuzz suite is skipped for the same reason the
  # macOS lane skips it: its elapsed-time budget was calibrated against an optimized build.
  #
  # The official toolchain image, as in format.yml's swift-format job, so the Swift version is
  # chosen here rather than by an image refresh.
  native-core-linux:
    name: Native Swift core (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check whether the native core changed
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          required=true
          if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null && \
            git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
              .github/workflows/ci.yml \
              Package.swift \
              Sources/RcNativePlayerCore \
              Tests/RcNativePlayerCoreTests
          then
            required=false
          fi
          echo "required=$required" | tee -a "$GITHUB_OUTPUT"
      - name: Test the native Swift core
        if: steps.filter.outputs.required == 'true'
        run: swift test --filter RcNativePlayerCoreTests --skip NativeSwiftFuzzTests

  # The Linux lane: everything that does not need a Mac. The JVM cuts of the whole player stack,
  # both vendored players, and the build-only fixture generators.
  #
  # `checkKotlinAbi` is deliberately NOT here. The committed dumps include a `.klib.api` covering the
  # Apple and wasmJs targets, and the Apple klibs only build on macOS — running the gate on Linux would
  # diff a partial surface against a complete dump. It runs in `players-macos` below, which is the
  # one job that can see all of it.
  jvm:
    name: JVM + Android players
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test automated Gradle launcher
        run: .github/scripts/test-agent-gradle.sh
      # The simulator boot retry only ever runs on macOS, against the least reproducible thing in
      # the job — which is how three scripts ended up with three different answers to it. This
      # holds its control flow to the contract against a stubbed `simctl`, on the cheap lane, so a
      # mistake in it is caught in seconds instead of fifty minutes later on a macOS runner.
      - name: Test the simulator boot helper
        run: scripts/simulator-boot.test.sh
      # Same reasoning for the lane's waiting rule: it decides when a ~700-document corpus run is
      # declared stuck, and getting it wrong costs a fifteen-minute macOS job that reports nothing.
      - name: Test the lane progress helper
        run: scripts/lane-progress.test.sh
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17.0.20+101"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - name: Run the vendored JS player conformance test
        working-directory: third_party/remote-compose-player
        run: |
          npm ci
          npm test

      # No dependencies and no corpus: the report generator is pure Node over a results file, so its
      # test runs anywhere. It is here rather than beside the lane because the lane is scheduled and
      # non-gating, while a generator that renders the wrong number would be believed.
      - name: Test the conformance report generator
        run: node --test scripts/conformance-report/render-report.test.mjs

      # `:third-party-rc-embedded-player` is an Android library, and the four published modules
      # carry an Android target, so this lane needs an SDK. The runner image ships one; AGP resolves
      # it from ANDROID_HOME. The published stack's `commonTest` also runs on the Android host JVM
      # (`testAndroidHostTest`); compose's run under Robolectric's native graphics, which is where
      # its `androidMain` drawing — and a sample of the remote-m3 catalog — renders.
      - name: Run the JVM and Android player suites
        run: |
          ./gradlew \
            :rc-player-trace:jvmTest \
            :rc-player-protocol:jvmTest \
            :rc-player-runtime:jvmTest \
            :rc-player-compose:jvmTest \
            :rc-player-trace:testAndroidHostTest \
            :rc-player-protocol:testAndroidHostTest \
            :rc-player-runtime:testAndroidHostTest \
            :rc-player-compose:testAndroidHostTest \
            :rc-player-compat-tests:test \
            :rc-player-metrics:test \
            :rc-player-profile:test \
            :third-party-rc-embedded-player:testDebugUnitTest

      # A test task that resolves to nothing still goes green. See the script's header.
      - name: Assert the JVM and Android suites executed
        run: |
          scripts/assert-test-execution.sh \
            rc-player/trace:jvmTest,testAndroidHostTest \
            rc-player/protocol:jvmTest,testAndroidHostTest \
            rc-player/runtime:jvmTest,testAndroidHostTest \
            rc-player/compose:jvmTest,testAndroidHostTest \
            rc-player/compat-tests:test \
            rc-player/metrics:test \
            rc-player/profile:test \
            third_party/rc-embedded-player:testDebugUnitTest

      # The Wasm distribution and its size ratchet. `wasmPlayerTestDist` also stages the AndroidX
      # generated fixtures next to the bundle, so the browser smoke input is built from the real
      # writer rather than from the player's own output.
      - name: Build the Wasm player distribution
        run: ./gradlew :rc-player-wasm:wasmPlayerTestDist

      # ...and then open it. Until #77 nothing did: the staged bundle was built on this runner,
      # size-checked, and thrown away, so a wasm regression that still compiled shipped. This is the
      # cheap lane and the bundle is already here, which is why the browser run belongs on Linux
      # rather than behind the macOS lane's gate.
      #
      # It is not the same coverage as `wasmJsBrowserTest` over on `players-macos`: that runs the
      # Kotlin `commonTest` sources, this runs the *artifact* — the production-compiled
      # `rcPlayer.wasm`, `index.html`, the import map, the bundled font manifest and the embed
      # contract every host codes against.
      - name: Smoke-test the Wasm player bundle in a headless browser
        working-directory: scripts/wasm-smoke
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jvm-test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          retention-days: 7

  # The macOS lane: the native Apple targets, the wasm browser tests, and the ABI gate that depends
  # on them. This is the only host that can run any of the three, so it runs on every pull request —
  # the `apple-changes` gate below applies to the packaging steps at the bottom of this job, not to
  # the job (#77). A test-only run of this lane is a fraction of a full one: the release XCFramework
  # link is the step that costs the minutes.
  players-macos:
    name: Apple + wasm tests, ABI gate, Apple packaging
    needs: apple-changes
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17.0.20+101"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # Compose Multiplatform 1.11's `ui-uikit` links against iOS 26 SDK symbols — `CMPLayoutRegion`
      # references `UIViewLayoutRegion`, which does not exist before iOS 26. The `macos-15` image
      # ships several Xcode 26.x alongside 16.4 but still *defaults* to 16.4 (iOS 18.5 SDK), so
      # `:rc-player-compose:linkDebugTestIosSimulatorArm64` dies with
      # `Undefined symbols for architecture arm64: "_OBJC_CLASS_$_UIViewLayoutRegion"`. Select the
      # newest installed Xcode 26 rather than pinning one, so an image refresh that retires a point
      # release doesn't take the job with it.
      - name: Select an Xcode with the iOS 26 SDK
        run: |
          set -euo pipefail
          xcode="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$xcode" ]; then
            echo "No Xcode 26 on this image; Compose Multiplatform's iOS targets need its SDK." >&2
            ls -d /Applications/Xcode*.app >&2
            exit 1
          fi
          sudo xcode-select --switch "$xcode/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphonesimulator

      # No `iosX64` anywhere in this list. `:rc-player-compose` never had one — CMP 1.11 dropped the
      # Intel-iOS-simulator variant — and its three siblings dropped theirs when the stack became
      # publishable, because publishing a stack that resolves three of four artifacts on one target
      # is worse than not offering it. Naming a task that no longer exists fails the whole
      # invocation ("Cannot locate tasks that match ..."), not just that one target. The native
      # macOS target is arm64-only for the same reason.
      #
      # `allTests` does not imply `check`, so the ABI gate has to be named explicitly. Regenerate
      # the dumps with `./gradlew :rc-player-<module>:updateKotlinAbi` when a surface change is
      # intended.
      - name: Run the Apple player tests and the ABI gate
        run: |
          ./gradlew \
            :rc-player-trace:checkKotlinAbi \
            :rc-player-protocol:checkKotlinAbi \
            :rc-player-runtime:checkKotlinAbi \
            :rc-player-compose:checkKotlinAbi \
            :rc-player-trace:allTests \
            :rc-player-protocol:allTests \
            :rc-player-runtime:allTests \
            :rc-player-compose:allTests \
            :rc-player-protocol:compileTestKotlinIosArm64 \
            :rc-player-protocol:compileTestKotlinIosSimulatorArm64 \
            :rc-player-runtime:compileTestKotlinIosArm64 \
            :rc-player-runtime:compileTestKotlinIosSimulatorArm64 \
            :rc-player-compose:compileTestKotlinIosArm64 \
            :rc-player-compose:compileTestKotlinIosSimulatorArm64 \
            :rc-player-protocol:compileTestKotlinMacosArm64 \
            :rc-player-runtime:compileTestKotlinMacosArm64 \
            :rc-player-compose:compileTestKotlinMacosArm64

      # `allTests` is an aggregate resolved per target on the runner, so until #77 the coverage it
      # gave was an assumption: a target whose test task drops out — no browser for
      # `wasmJsBrowserTest`, no bootable simulator for `iosSimulatorArm64Test` — leaves the job
      # green and the lane empty. Naming the four targets here turns that into a fact, and any
      # future `allTests` member that stops running fails the job that claims to run it.
      - name: Assert the Apple and wasm targets executed
        run: |
          scripts/assert-test-execution.sh \
            rc-player/trace:jvmTest,macosArm64Test,iosSimulatorArm64Test,wasmJsBrowserTest \
            rc-player/protocol:jvmTest,macosArm64Test,iosSimulatorArm64Test,wasmJsBrowserTest \
            rc-player/runtime:jvmTest,macosArm64Test,iosSimulatorArm64Test,wasmJsBrowserTest \
            rc-player/compose:jvmTest,macosArm64Test,iosSimulatorArm64Test,wasmJsBrowserTest

      # Everything from here down is the Apple *packaging* half, and the only half the path filter
      # gates: the release link, the Swift type check and the Xcode build are what make this lane
      # expensive, and they cannot be affected by a change that touches none of the paths listed in
      # `apple-changes`. The tests and the ABI gate above have already run.

      # `Package.swift`'s two SPM-verified values are written by the release job, never by hand.
      # This proves the writer still works before a release depends on it.
      - name: Run the Package.swift rewriter self-test
        if: needs.apple-changes.outputs.required == 'true'
        run: scripts/update-package-swift.sh --self-test

      # The release link, run on every PR that can affect the Apple artifact. This is the same task
      # `release.yml` drives, so a linker failure surfaces here rather than mid-release — and it is
      # what makes the Swift step below check something real instead of self-skipping.
      #
      # `--max-workers=1` is load-bearing, not caution. Kotlin/Native compiles inside the Gradle
      # daemon's own JVM, so with `org.gradle.parallel=true` the `IosArm64` and `IosSimulatorArm64`
      # release links would run `ModuleDFGBuilder` concurrently *in one heap* and peak together.
      # Serializing them halves the peak; `gradle.properties` carries the rest of the reasoning.
      - name: Assemble the release XCFramework
        if: needs.apple-changes.outputs.required == 'true'
        run: |
          ./gradlew \
            :rc-player-compose:rcPlayerXcframeworkChecksum \
            :rc-player-compose:rcNativePlayerUIKitPackageChecksum \
            --max-workers=1

      - name: Validate the native UIKit release package
        if: needs.apple-changes.outputs.required == 'true'
        run: scripts/check-native-uikit-package.sh

      - name: Validate the native UIKit support profile
        if: needs.apple-changes.outputs.required == 'true'
        run: scripts/check-native-uikit-profile.sh

      # Type-checks the Swift sample in docs/design/RC_PLAYER_SWIFT.md against the real framework.
      # Exits 0 and says so when no framework is present, so it is honest about what it checked —
      # with the step above restored, a framework *is* present and this genuinely type-checks.
      - name: Type-check the Swift usage sample
        if: needs.apple-changes.outputs.required == 'true'
        run: scripts/check-swift-sample.sh

      # The native player's SwiftPM test target on the macOS host: the pure-Swift core and every
      # renderer-neutral policy in `RcNativePlayerUIKit`. The fuzz suite is skipped here and run
      # optimized below, because its elapsed-time budget was calibrated against an `-O` build. It
      # replaced one `swiftc` script per test file, each compiling a hand-picked subset of sources —
      # so a file added to a target but missed by the scripts was never type-checked, and a fixture
      # passed by position could silently disable a block. Native-only mode keeps the Kotlin binary
      # target out of the package graph; nothing here needs the framework assembled above.
      - name: Test the native Swift player on macOS
        if: needs.apple-changes.outputs.required == 'true'
        env:
          RC_COMPOSE_PLAYER_NATIVE_ONLY: 1
        run: swift test --skip NativeSwiftFuzzTests

      # The same test target built for, and run on, an iOS simulator: the only place the UIKit
      # renderer behind `#if canImport(UIKit)` is compiled as a package rather than through the
      # sample app.
      - name: Test the native Swift player on an iOS simulator
        if: needs.apple-changes.outputs.required == 'true'
        run: scripts/check-native-swift-ios-tests.sh

      # visionOS has no Kotlin slice, so the overlay builds there against the native Swift player
      # alone (the manifest links the XCFramework on iOS and macOS only). A generic device build
      # needs only the xros SDK, not a simulator runtime. Xcode 26 ships visionOS as an optional
      # platform component, so an image without it skips with a warning rather than failing; once
      # the SDK is present, a build failure fails the job.
      - name: Build the native Swift packages for visionOS
        if: needs.apple-changes.outputs.required == 'true'
        env:
          RC_COMPOSE_PLAYER_NATIVE_ONLY: 1
        run: |
          set -euo pipefail
          if ! xcodebuild -showsdks | grep -q -- '-sdk xros'; then
            echo "::warning::No visionOS SDK in $(xcode-select -p); skipping the visionOS build."
            exit 0
          fi
          xcodebuild build -quiet \
            -scheme RcComposePlayer-Package \
            -destination 'generic/platform=visionOS' \
            -derivedDataPath build/native-swift-visionos \
            CODE_SIGNING_ALLOWED=NO

      # The derived corpus, unsanitized and optimized (the script builds release when no sanitizer
      # is set). A failing fuzz input is the whole point of this test, and the default temporary
      # directory is not in the uploaded artifact.
      - name: Fuzz the pure Swift document core
        if: needs.apple-changes.outputs.required == 'true'
        env:
          RC_NATIVE_FUZZ_CORPUS_OUT: ${{ github.workspace }}/build/native-fuzz-failures
        run: scripts/check-native-swift-fuzz.sh

      # The address-sanitized pass, shorter because the sanitizer is the expensive part, not the
      # mutation count.
      - name: Fuzz the pure Swift document core under AddressSanitizer
        if: needs.apple-changes.outputs.required == 'true'
        env:
          RC_NATIVE_FUZZ_CORPUS_OUT: ${{ github.workspace }}/build/native-fuzz-failures
          RC_NATIVE_FUZZ_SANITIZE: address
          RC_NATIVE_FUZZ_ITERATIONS: 24
        run: scripts/check-native-swift-fuzz.sh

      - name: Benchmark the pure Swift document core
        if: needs.apple-changes.outputs.required == 'true'
        run: scripts/measure-native-swift-core.sh

      # A header-only type check cannot catch application-host contracts. In particular,
      # ComposeUIViewController enforces its high-refresh plist entry at runtime, and Xcode's
      # generic Simulator build asks for x86_64 unless the arm64-only framework constraint is
      # stated by the consumer. The project links the XCFramework assembled above, so its binary
      # and source overlay always describe the same current API.
      - name: Build and package the Apple player app
        if: needs.apple-changes.outputs.required == 'true'
        # The framework is assembled by an earlier step in this job. Requiring it rather than
        # letting the script assemble one keeps a fault in that step loud: a silent twenty-minute
        # rebuild here would hide it and bill the job for it.
        env:
          RC_APPLE_PLAYER_REQUIRE_FRAMEWORK: 1
        run: |
          scripts/package-apple-player.sh
          scripts/package-macos-player.sh

      - name: Measure native UIKit performance and footprint
        if: needs.apple-changes.outputs.required == 'true'
        run: scripts/measure-native-uikit-simulator.sh

      # This is intentionally an evidence lane rather than a timing gate. Both implementations run
      # from the packaged Release macOS app on the runner's Apple-silicon host; no simulator is
      # involved, and host load still makes the numbers unsuitable as a product SLA.
      - name: Compare Apple player macOS benchmarks
        if: needs.apple-changes.outputs.required == 'true'
        run: scripts/measure-apple-players-macos.sh

      - name: Measure native AppKit performance and footprint
        if: needs.apple-changes.outputs.required == 'true'
        run: scripts/measure-native-appkit.sh

      - name: Compare native UIKit against CMP on representative content
        if: needs.apple-changes.outputs.required == 'true'
        env:
          RC_NATIVE_UIKIT_SKIP_BUILD: 1
        run: scripts/check-native-uikit-comparison.sh

      # The same two lanes over ~700 real Material 3 documents from wear-m3-catalog, instead of the
      # four fixtures above. ENRICHMENT: it reports what the native player declines rather than
      # failing on it, and a corpus it cannot fetch is skipped — the sheet is generated output this
      # repository does not control, served by a live host. See
      # docs/design/RC_CATALOG_CORPUS_LANE.md.
      #
      # On PUSH ONLY. It adds about ten minutes to a job that has hit its 90-minute ceiling once
      # already, and a non-gating score does not need to be on the path of every pull request to do
      # its job — main produces the findings continuously, and the script runs locally unchanged.
      #
      # `continue-on-error` is what actually makes it non-gating, and the script alone was not
      # enough: it fails soft on a corpus it cannot fetch, but a crash in either lane still exited
      # non-zero and would have taken main red on a step that is explicitly not a gate. The step
      # still shows as failed and still says why — it just cannot fail the job, which is the
      # difference between evidence and a gate.
      - name: Score native UIKit against CMP on the catalog corpus
        if: needs.apple-changes.outputs.required == 'true' && github.event_name == 'push'
        continue-on-error: true
        env:
          RC_NATIVE_UIKIT_SKIP_BUILD: 1
        run: scripts/check-native-uikit-corpus.sh

      # Machine-readable, budget-carrying evidence for all three native lanes, plus the rendered
      # comparison output — including the same title-card bytes through both density modes, which
      # is what makes the default mode's geometry reviewable rather than described. Uploaded
      # whether or not the run passed, because a regression is reviewed from the numbers.
      - name: Upload native performance and comparison evidence
        if: always() && needs.apple-changes.outputs.required == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-performance-evidence
          if-no-files-found: warn
          path: |
            build/native-swift-core-benchmark.json
            build/native-uikit-evidence.json
            build/apple-player-benchmark.json
            build/native-appkit-evidence.json
            build/native-fuzz-failures
            build/native-uikit-comparison
            build/native-uikit-corpus/comparison.json

      # Launches the packaged app on a real simulator and checks captured pixels for the white
      # title-card canvas, its dark content band, and the coloured host background. This covers the
      # Metal/Skiko presentation path that Kotlin/Native tests and a Swift type check cannot enter.
      - name: Validate the Apple player screenshot
        if: needs.apple-changes.outputs.required == 'true'
        run: scripts/check-apple-player-screenshot.sh

      - name: Validate native UIKit accessibility presentation
        if: needs.apple-changes.outputs.required == 'true'
        run: scripts/check-native-uikit-accessibility-simulator.sh

      - name: Validate native UIKit accessibility UI
        if: needs.apple-changes.outputs.required == 'true'
        run: scripts/check-native-uikit-accessibility-ui.sh

      - name: Validate native UIKit animation pacing
        if: needs.apple-changes.outputs.required == 'true'
        run: scripts/check-native-uikit-animation-simulator.sh

      - name: Upload the Apple player screenshot
        if: always() && needs.apple-changes.outputs.required == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apple-player-screenshot
          path: |
            build/apple-player-screenshot.png
            build/native-uikit-accessibility.png
            build/native-uikit-accessibility-ui.xcresult
            build/native-uikit-accessibility-ui-first-attempt.xcresult
            build/native-uikit-animation-a.png
            build/native-uikit-animation-b.png
            build/native-uikit-evidence.json
            build/native-uikit-comparison
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload player test reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apple-test-reports
          path: |
            rc-player/**/build/reports/tests/**
            rc-player/**/build/test-results/**
            build/native-swift-ios-tests.xcresult
          retention-days: 7
