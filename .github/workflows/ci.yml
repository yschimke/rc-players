name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Nightly, for the macOS lane's evidence steps (benchmark comparisons and the corpus score) that
  # record numbers rather than gate anything. They used to run on every push to main, about ten
  # minutes of macOS runner a merge; a nightly sample of main records the same trend. Everything
  # else in this workflow runs nightly too, as a full verification of main's head.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A pull request collapses per branch: a new push supersedes the run it replaces, because only the
# latest state of a branch is worth a runner.
#
# A PUSH TO MAIN GETS A GROUP OF ITS OWN, per commit. Every main run used to share
# `CI-refs/heads/main`, and a group holds ONE run and ONE pending run: a third arrival does not
# queue behind the other two, it cancels the one that was waiting. With a 45-70 minute Apple lane
# and merges arriving faster than that, commits were not being verified late — they were not being
# verified at all. On 16 Sep the runs for `1e03fb6` and `2d968c4` were both cancelled that way, and
# `2d968c4` was the commit that first carried the catalog corpus score.
#
# Serialising never saved a runner minute either. Six merges cost six runs' worth of macOS time
# whether they overlap or not; sharing a group only decided when it was spent, and which commits
# got skipped. `cancel-in-progress: true` is the same trade taken further, not a fix for it.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref
    }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether the macOS lane runs at all, and what in it is worth its minutes. Two outputs:
  #
  # `lane` decides whether the macOS jobs (`apple-tests` and the packaging/validation jobs) run. On
  # a push to main they always do. On a pull request they run only when the change touches the Apple
  # projects themselves: the Swift package and its tests, the Apple samples, the Apple scripts, the
  # Kotlin `apple*`/`ios*`/`macos*`/`native*` source sets, or this workflow. Everything else,
  # including a Gradle dependency bump or a common-code change, waits for main's push run to
  # exercise the XCFramework link and the Swift side: a macOS runner queues for 30-80 minutes, and
  # every such PR paid that. What used to make the lane mandatory on every PR (#77) now runs on
  # Linux in `jvm`: the wasm browser tests, and the ABI gate including the Apple klibs, which
  # Kotlin/Native cross-compiles off macOS.
  #
  # `required` gates the packaging and validation jobs once the Apple lane runs: the parallel
  # framework links, XCFramework assembly, native Swift tests/fuzz/packaging, the Swift type check,
  # and the Xcode/simulator checks. It is the wider list, so a push to main still skips packaging
  # when nothing it builds from changed. On a pull request `lane` almost always implies `required`:
  # every `lane` path lies inside a `required` one except eight scripts the `scripts/*` globs catch
  # that no step of this lane runs — the Apple font, benchmark-interaction and custom-component
  # checks, and three run elsewhere (`check-apple-player-sources.sh` in this job,
  # `build-remote-apple-comparison.sh` and `run-swift-tests-isolated.py` in their own workflows). A
  # change to only those runs `apple-tests` (tests and the ABI gate), and no packaging jobs.
  #
  # Keep the list here (rather than a third-party path-filter action) so the exact trust boundary is
  # visible and changes to this workflow always exercise the lane once before changing its own gate.
  #
  # `Sources` is the Swift overlay, and the whole directory rather than the one target in it: the
  # `RcComposePlayerSwiftUI` target declares no `path`, so SwiftPM takes `Sources/<target name>` and
  # any target added later lands here too. `Package.swift` above does not stand in for it — adding a
  # file to an existing target changes what ships without changing the manifest. It has to be gated
  # because the two steps that ever compile it are gated: `check-swift-sample.sh` builds
  # `Sources/RcComposePlayerSwiftUI/*.swift` directly, and the sample Xcode project
  # `package-apple-player.sh` builds references the same files. Left out, a change confined to the
  # overlay met neither, and an overlay that does not compile — or no longer matches the
  # framework — could reach SwiftPM consumers with both Apple checks skipped (#69).
  #
  # `Tests` is listed whole for the same reason: SwiftPM takes each test target from
  # `Tests/<target name>`, and listing the targets one by one let #949's
  # `RcComposePlayerSwiftUITests` merge with no job compiling a pull request confined to it.
  # `Tests/RcPlayerAppleFontsTests` is excluded: it is not a `Package.swift` target and no step of
  # this lane compiles it, so it would start the packaging for nothing.
  apple-changes:
    name: Apple packaging changes
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.filter.outputs.required }}
      lane: ${{ steps.filter.outputs.lane }}
      kotlin-version: ${{ steps.filter.outputs.kotlin-version }}
      jvm: ${{ steps.jvm-filter.outputs.jvm }}
      three-d: ${{ steps.three-d-filter.outputs.three-d }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Seconds on Linux, so it runs on every change: the sample app lists package sources by hand,
      # and a Swift file missing from it otherwise fails only at `package-apple-player.sh`, well
      # into the macOS lane.
      - name: Check the Apple sample app lists every package source
        run: scripts/check-apple-player-sources.sh
      - name: Check whether the Apple lane is required
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          required=true
          if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null && \
            git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
              .github/workflows/ci.yml \
              .github/workflows/release.yml \
              .github/actions/select-xcode-26 \
              Package.swift \
              Sources \
              Tests \
              ':(exclude)Tests/RcPlayerAppleFontsTests' \
              distribution/native-uikit \
              distribution/rc-swift \
              scripts/stage-rc-swift-repo.sh \
              scripts/publish-rc-swift.sh \
              build.gradle.kts \
              settings.gradle.kts \
              gradle.properties \
              gradle \
              gradlew \
              gradlew.bat \
              build-logic \
              rc-player/trace \
              rc-player/protocol \
              rc-player/runtime \
              rc-player/compose \
              samples/apple-player \
              samples/macos-player \
              scripts/build-apple-player.sh \
              scripts/build-macos-player.sh \
              scripts/check-apple-player-screenshot.sh \
              scripts/check-native-uikit-accessibility-ui.sh \
              scripts/check-native-uikit-accessibility-simulator.sh \
              scripts/check-native-uikit-animation-simulator.sh \
              scripts/check-native-uikit-comparison.sh \
              scripts/measure-native-appkit.sh \
              scripts/measure-native-swift-core.sh \
              scripts/check-native-swift-fuzz.sh \
              scripts/check-native-swift-ios-tests.sh \
              scripts/measure-native-uikit-simulator.sh \
              scripts/measure-apple-players-macos.sh \
              scripts/measure-apple-players-simulator.sh \
              scripts/native-uikit-comparison \
              scripts/check-native-uikit-package.sh \
              scripts/check-native-uikit-profile.sh \
              scripts/check-swift-sample.sh \
              scripts/package-apple-player.sh \
              scripts/package-macos-player.sh \
              scripts/package-swift-render.sh \
              scripts/check-swift-render.sh \
              scripts/render-native-uikit-lane.sh \
              scripts/simulator-boot.sh \
              scripts/check-native-uikit-corpus.sh \
              scripts/rc-catalog-corpus \
              scripts/set-apple-player-package-version.sh \
              scripts/update-package-swift.sh \
              scripts/validate-apple-player-screenshot.swift \
              scripts/validate-native-uikit-animation.swift \
              docs/design/RC_PLAYER_SWIFT.md
          then
            required=false
          fi
          echo "required=$required" | tee -a "$GITHUB_OUTPUT"

          lane=true
          if [ "$EVENT_NAME" = pull_request ] && \
            git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null && \
            git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
              .github/workflows/ci.yml \
              .github/workflows/release.yml \
              .github/actions/select-xcode-26 \
              Package.swift \
              Sources \
              Tests \
              ':(exclude)Tests/RcPlayerAppleFontsTests' \
              distribution/native-uikit \
              ':(glob)rc-player/*/src/apple*/**' \
              ':(glob)rc-player/*/src/ios*/**' \
              ':(glob)rc-player/*/src/macos*/**' \
              ':(glob)rc-player/*/src/native*/**' \
              samples/apple-player \
              samples/macos-player \
              ':(glob)scripts/*apple*' \
              ':(glob)scripts/*macos*' \
              ':(glob)scripts/*native-uikit*' \
              ':(glob)scripts/*native-appkit*' \
              ':(glob)scripts/*swift*' \
              scripts/simulator-boot.sh \
              scripts/rc-catalog-corpus \
              docs/design/RC_PLAYER_SWIFT.md
          then
            lane=false
          fi
          echo "lane=$lane" | tee -a "$GITHUB_OUTPUT"

          kotlin_version="$(sed -n 's/^kotlin = "\([^"]*\)"/\1/p' gradle/libs.versions.toml | head -n 1)"
          if [ -z "$kotlin_version" ]; then
            echo "Could not read kotlin version from gradle/libs.versions.toml" >&2
            exit 1
          fi
          echo "kotlin-version=$kotlin_version" | tee -a "$GITHUB_OUTPUT"

      # `jvm` decides whether the JVM + Android lane runs. It is the opposite kind of list from the
      # two above: not what the lane covers, but what it provably cannot read, so anything new or
      # unlisted runs it. A pull request skips the lane only when every changed file is Swift
      # (`Sources`, `Tests`, the two Apple samples), docs, renders or the root README/CHANGELOG —
      # over Sep–Oct that was about one merged PR in five, each paying ~6 minutes of
      # JVM-lane overhead the build cache could not remove. Pushes to main always run it.
      #
      # `Tests/RcNativePlayerCoreTests/Fixtures` is the exception inside `Tests`:
      # `:rc-player-protocol` adds it as a JVM test resource directory, so the Kotlin and Swift
      # decoders read the same fixture bytes. A change there must run this lane.
      #
      # Fails open: an unreadable base, an empty diff or any unexpected path all mean `true`.
      - name: Check whether the JVM lane is required
        id: jvm-filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          jvm=true
          if [ "$EVENT_NAME" = pull_request ] && \
            git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null && \
            changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")" && \
            [ -n "$changed" ]; then
            outside="$(printf '%s\n' "$changed" | grep -vE \
              '^(Sources/|Tests/|samples/(apple|macos)-player/|docs/|renders/|README\.md$|CHANGELOG\.md$)' \
              || true)"
            fixtures="$(printf '%s\n' "$changed" | grep -E '^Tests/RcNativePlayerCoreTests/Fixtures/' \
              || true)"
            if [ -z "$outside" ] && [ -z "$fixtures" ]; then
              jvm=false
            fi
          fi
          echo "jvm=$jvm" | tee -a "$GITHUB_OUTPUT"

      # `three-d` gates the XR sample's build and lint inside the JVM lane, and the 3D WebGL2
      # browser test: an Android app build and its lint are minutes that only a change to the 3D
      # extension, the sample, the player it plugs into or the build itself can affect. Pushes to
      # main always run them, and so does an unreadable base.
      - name: Check whether the 3D sample needs building
        id: three-d-filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          three_d=true
          if [ "$EVENT_NAME" = pull_request ] && \
            git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null && \
            git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
              .github/workflows/ci.yml \
              rc-player/three-d \
              rc-player/xr-sample \
              scripts/wasm-smoke/three-d-webgl.mjs \
              rc-player/compose \
              rc-player/runtime \
              rc-player/protocol \
              build.gradle.kts \
              settings.gradle.kts \
              gradle.properties \
              gradle \
              build-logic
          then
            three_d=false
          fi
          echo "three-d=$three_d" | tee -a "$GITHUB_OUTPUT"

  # The pure-Swift document core on Linux. It imports Foundation alone, so the one part of the native
  # player that every Apple host sits on can be tested on the cheap lane, in minutes, instead of
  # only behind the macOS job's packaging gate. Off Apple platforms `Package.swift` declares only
  # the pure-Swift targets — `RcNativePlayerCore`, the `RcCreation` authoring API and their tests —
  # so nothing here resolves the XCFramework or compiles a UIKit/AppKit/CoreGraphics target.
  # `RcCreationTests` reads every document it writes back through the core, and
  # `RcWireOperationsTests` round-trips the catalog corpus through upstream's generated Swift
  # bindings (`RcWireOperations`, Foundation-free), so both run here too. The fuzz suite is skipped for the same reason the
  # macOS lane skips it: its elapsed-time budget was calibrated against an optimized build.
  #
  # The official toolchain image, as in format.yml's swift-format job, so the Swift version is
  # chosen here rather than by an image refresh.
  native-core-linux:
    name: Native Swift core (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: swift:6.4-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check whether the native core changed
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          required=true
          if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null && \
            git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
              .github/workflows/ci.yml \
              Package.swift \
              Sources/RcNativePlayerCore \
              Tests/RcNativePlayerCoreTests \
              Sources/RcCreation \
              Tests/RcCreationTests \
              Sources/RcCreationFoundation \
              Sources/RcCreationAppleUI \
              Tests/RcCreationAppleUITests \
              Sources/RcCreationHost \
              Tests/RcCreationHostTests \
              Sources/RcWireOperations \
              Tests/RcWireOperationsTests \
              distribution/rc-swift \
              scripts/stage-rc-swift-repo.sh \
              scripts/rc-catalog-corpus/corpus
          then
            required=false
          fi
          echo "required=$required" | tee -a "$GITHUB_OUTPUT"
      - name: Test the native Swift core, the creation API and the generated wire operations
        if: steps.filter.outputs.required == 'true'
        run: >-
          swift test
          --filter 'RcNativePlayerCoreTests|RcCreationTests|RcCreationAppleUITests|RcCreationHostTests|RcWireOperationsTests'
          --skip NativeSwiftFuzzTests
      - name: Build the staged rc-swift mirror package on Linux
        if: steps.filter.outputs.required == 'true'
        run: |
          set -eu
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          scripts/stage-rc-swift-repo.sh "$work/rc-swift"
          swift build --package-path "$work/rc-swift"

  # The Linux lane: everything that does not need a Mac. The JVM cuts of the whole player stack,
  # both vendored players, and the build-only fixture generators.
  #
  # `checkKotlinAbi` runs here as well as in `apple-tests`. The committed `.klib.api` dumps cover
  # the Apple and wasmJs targets, and Kotlin/Native cross-compiles Apple klibs on Linux (it cannot
  # link them, which is the macOS lane's job), so this sees the whole surface: an edited
  # `// Targets: [apple]` declaration in a dump fails it here. Since the macOS lane now skips pull
  # requests that do not touch the Apple projects, this is where most PRs get the gate.
  #
  # Skipped on release-please's own release PR: it changes only the manifest, CHANGELOG.md and
  # version lines, and main's push run already verified all of the source. The PR author (or, for a
  # dispatched run, the actor) must be the bot, because branch names are contributor-controlled. A
  # job skipped by `if:` reports "skipped", which satisfies this required check. Same guard on the
  # macOS lane jobs; see yschimke/compose-ui-builder#700.
  jvm:
    name: JVM + Android players
    # `needs` only for the `jvm` output, which is computed in the seconds-long `apple-changes`
    # job. A skipped required check reports as passing, so this job must not be skipped because
    # its gate failed: `!cancelled()` keeps it alive when `apple-changes` fails, and anything but a
    # successful gate saying `false` runs the lane.
    needs: apple-changes
    if: ${{ !cancelled() && (needs.apple-changes.result != 'success' || needs.apple-changes.outputs.jvm != 'false') && !(startsWith(github.head_ref || github.ref_name, 'release-please--') && (github.event.pull_request.user.login || github.actor) == 'github-actions[bot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test automated Gradle launcher
        run: .github/scripts/test-agent-gradle.sh
      # The simulator boot retry only ever runs on macOS, against the least reproducible thing in
      # the job — which is how three scripts ended up with three different answers to it. This
      # holds its control flow to the contract against a stubbed `simctl`, on the cheap lane, so a
      # mistake in it is caught in seconds instead of fifty minutes later on a macOS runner.
      #
      # Same reasoning for the lane's waiting rule: it decides when a ~700-document corpus run is
      # declared stuck, and getting it wrong costs a fifteen-minute macOS job that reports nothing.
      #
      # Each suite spends ~30 s of wall clock asleep, exercising real deadlines, and neither uses
      # the CPU while it does, so they run side by side: one wait instead of two. Both make their
      # own `mktemp -d`. They run here, before Gradle starts, rather than in the background beside
      # it, because their deadlines are a few seconds wide and a busy runner would make them flaky.
      - name: Test the simulator boot and lane progress helpers
        run: |
          scripts/simulator-boot.test.sh > "$RUNNER_TEMP/simulator-boot.log" 2>&1 &
          boot=$!
          scripts/lane-progress.test.sh > "$RUNNER_TEMP/lane-progress.log" 2>&1 &
          lane=$!
          status=0
          wait "$boot" || { status=1; echo "::error::scripts/simulator-boot.test.sh failed"; }
          wait "$lane" || { status=1; echo "::error::scripts/lane-progress.test.sh failed"; }
          for suite in simulator-boot lane-progress; do
            echo "::group::$suite"
            cat "$RUNNER_TEMP/$suite.log"
            echo "::endgroup::"
          done
          exit "$status"
      # The release's publish plan decides which coordinates reach Maven Central, and a module it
      # wrongly skips is unrepairable (Central refuses a second upload of a version). #512 was two
      # dist modules going stale because the plan could not see what they package; these fixtures
      # hold it to following those inputs, and to publishing whenever it cannot tell.
      - name: Test the Maven publish plan
        run: .github/scripts/test-maven-publish-plan.sh
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17.0.21+100000002"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: ./.github/actions/buildfetch-cache
        with:
          rw-token: ${{ github.event_name == 'push' && secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN || '' }}
          ro-token: ${{ secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN_RO }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
      - name: Run the vendored JS player conformance test
        working-directory: third_party/remote-compose-player
        run: |
          # These tests stub Canvas2D and never load node-canvas's native binding.
          npm ci --ignore-scripts
          npm test

      - name: Verify the published TypeScript bundle matches its source
        run: bash scripts/check-typescript-dist.sh

      # Chromium only, without `--with-deps`: the runner image already ships Chrome and the system
      # libraries it needs, and the extra packages (mostly CJK and fallback fonts, plus Xvfb) came
      # from the Ubuntu mirror, which at times served them at under 100 kB/s and cost this step
      # 5-8 minutes instead of ~30 s.
      - name: Test browser input values, nested identities and clipped hit testing
        run: |
          npm --prefix scripts/wasm-smoke ci
          (cd scripts/wasm-smoke && npx playwright install chromium)
          third_party/remote-compose-player/node_modules/.bin/esbuild third_party/remote-compose-player/src/input.browser-harness.ts --bundle --format=iife --global-name=InputTest --outfile=/tmp/rc-input-harness.js
          PLAYWRIGHT_MODULE="$PWD/scripts/wasm-smoke/node_modules/playwright/index.mjs" RC_INPUT_HARNESS_JS=/tmp/rc-input-harness.js node --test scripts/rc-input-message/input.browser.test.mjs

      # No dependencies and no corpus: the report generator is pure Node over a results file, so its
      # test runs anywhere. It is here rather than beside the lane because the lane is scheduled and
      # non-gating, while a generator that renders the wrong number would be believed.
      - name: Test the conformance report generator
        run: node --test scripts/conformance-report/render-report.test.mjs

      # The release's other half: which Central uploads `publishPlayers` schedules for each shape of
      # plan. An empty plan must upload nothing — not even the BOM (compose-ai-tools#5532) — and a
      # recovery run with no plan must upload everything. Needs Gradle (and so the Android SDK).
      - name: Test publishPlayers against the publish plan
        run: .github/scripts/test-publish-players-tasks.sh

      # `:third-party-rc-embedded-player` is an Android library, and the four published modules
      # carry an Android target, so this lane needs an SDK. The runner image ships one; AGP resolves
      # it from ANDROID_HOME. The published stack's `commonTest` also runs on the Android host JVM
      # (`testAndroidHostTest`); compose's run under Robolectric's native graphics, which is where
      # its `androidMain` drawing — and a sample of the remote-m3 catalog — renders.
      - name: Run the JVM and Android player suites
        run: |
          ./gradlew \
            :rc-player-trace:jvmTest \
            :rc-player-protocol:jvmTest \
            :rc-player-runtime:jvmTest \
            :rc-player-compose:jvmTest \
            :rc-player-3d:jvmTest \
            :rc-player-3d:compileAndroidMain \
            :rc-player-edit:jvmTest \
            :rc-creation-writer:jvmTest \
            :rc-creation-expression:jvmTest \
            :rc-player-embedded:jvmTest \
            :rc-creation-bridge:jvmTest \
            :rc-creation-compose:compileAndroidMain \
            :rc-creation-foundation:compileAndroidMain \
            :rc-creation-wear-material3:compileAndroidMain \
            :rc-creation-coexistence-check:check \
            :rc-creation-bridge:compileAndroidMain \
            :rc-player-embedded:compileAndroidMain \
            :rc-player-wasm:jvmTest \
            :rc-player-trace:testAndroidHostTest \
            :rc-player-protocol:testAndroidHostTest \
            :rc-player-runtime:testAndroidHostTest \
            :rc-player-compose:testAndroidHostTest \
            :rc-player-edit:testAndroidHostTest \
            :rc-player-compat-tests:test \
            :rc-player-metrics:test \
            :rc-player-profile:test \
            :rc-player-desktop:test \
            :rc-codegen:check \
            :rc-widget-core:jvmTest \
            :rc-widget-core:testAndroidHostTest \
            :rc-widget-creation:compileAndroidMain \
            :rc-widget-launcher-core:testAndroidHostTest \
            :rc-widget-launcher-cmp:testAndroidHostTest \
            :rc-widget-launcher:testAndroidHostTest \
            :rc-widget-wear:testAndroidHostTest \
            :third-party-rc-embedded-player:testDebugUnitTest

      # The XR sample: an Android app, so its build and lint are skipped on pull requests that
      # cannot affect it (see `three-d` above).
      - name: Build and lint the XR sample
        if: needs.apple-changes.outputs.three-d != 'false'
        run: |
          ./gradlew \
            :rc-player-xr-sample:testDebugUnitTest \
            :rc-player-xr-sample:assembleDebug \
            :rc-player-xr-sample:lintDebug

      # The wasm browser suites and the ABI gate, which until the macOS lane started skipping
      # non-Apple PRs ran only there. Both work on Linux: wasmJs tests drive the runner's headless
      # Chrome through Karma, and the gate cross-compiles the Apple klibs (see the note above).
      - name: Run the wasm browser suites and the ABI gate
        run: |
          ./gradlew \
            :rc-player-trace:checkKotlinAbi \
            :rc-player-protocol:checkKotlinAbi \
            :rc-player-runtime:checkKotlinAbi \
            :rc-player-compose:checkKotlinAbi \
            :rc-player-3d:checkKotlinAbi \
            :rc-player-3d:compileKotlinWasmJs \
            :rc-player-edit:checkKotlinAbi \
            :rc-creation-writer:checkKotlinAbi \
            :rc-creation-expression:checkKotlinAbi \
            :rc-creation-compose:checkKotlinAbi \
            :rc-creation-foundation:checkKotlinAbi \
            :rc-creation-wear-material3:checkKotlinAbi \
            :rc-creation-expression:verifyPublishedCapabilities \
            :rc-creation-compose:verifyPublishedCapabilities \
            :rc-creation-foundation:verifyPublishedCapabilities \
            :rc-creation-wear-material3:verifyPublishedCapabilities \
            :rc-creation-bridge:checkKotlinAbi \
            :rc-player-embedded:checkKotlinAbi \
            :rc-player-embedded:compileKotlinWasmJs \
            :rc-widget-core:checkKotlinAbi \
            :rc-widget-creation:checkKotlinAbi \
            :rc-widget-creation-androidx:checkKotlinAbi \
            :rc-widget-launcher-core:checkKotlinAbi \
            :rc-widget-launcher-cmp:checkKotlinAbi \
            :rc-widget-launcher:checkKotlinAbi \
            :rc-widget-launcher-core:verifyCreationApiIsolation \
            :rc-widget-launcher-cmp:verifyCreationApiIsolation \
            :rc-widget-launcher:verifyCreationApiIsolation \
            :rc-widget-wear:checkKotlinAbi \
            :rc-widget-creation:compileKotlinWasmJs \
            :rc-widget-core:compileCommonMainKotlinMetadata \
            :rc-widget-creation:compileCommonMainKotlinMetadata \
            :rc-widget-core:wasmJsBrowserTest \
            :rc-player-trace:wasmJsBrowserTest \
            :rc-player-protocol:wasmJsBrowserTest \
            :rc-player-runtime:wasmJsBrowserTest \
            :rc-player-compose:wasmJsBrowserTest \
            :rc-player-edit:wasmJsBrowserTest

      # A test task that resolves to nothing still goes green. See the script's header.
      - name: Assert the JVM and Android suites executed
        run: |
          scripts/assert-test-execution.sh \
            rc-player/trace:jvmTest,testAndroidHostTest,wasmJsBrowserTest \
            rc-player/protocol:jvmTest,testAndroidHostTest,wasmJsBrowserTest \
            rc-player/runtime:jvmTest,testAndroidHostTest,wasmJsBrowserTest \
            rc-player/compose:jvmTest,testAndroidHostTest,wasmJsBrowserTest \
            rc-player/edit:jvmTest,testAndroidHostTest,wasmJsBrowserTest \
            third_party/remote-creation-writer:jvmTest \
            third_party/remote-creation-compose/expression:jvmTest \
            rc-player/embedded:jvmTest \
            rc-player/wasm:jvmTest \
            rc-player/compat-tests:test \
            rc-player/metrics:test \
            rc-player/profile:test \
            rc-player/desktop:test \
            rc-widget/core:jvmTest,testAndroidHostTest,wasmJsBrowserTest \
            rc-widget/launcher:testAndroidHostTest \
            rc-widget/wear:testAndroidHostTest \
            third_party/rc-embedded-player:testDebugUnitTest

      # The Linux desktop viewer's release assets, built and opened exactly as release.yml's
      # `attach-linux-viewer` does, so a packaging break shows up on the PR rather than on a tag.
      - name: Package and smoke-test the Linux desktop viewer
        run: |
          sudo apt-get install -y --no-install-recommends fakeroot
          ./gradlew :rc-player-desktop:packageRcDesktopLinux
          scripts/check-linux-viewer.sh

      # The Wasm distribution and its size ratchet. `wasmPlayerTestDist` also stages the AndroidX
      # generated fixtures next to the bundle, so the browser smoke input is built from the real
      # writer rather than from the player's own output.
      - name: Build the Wasm player distribution
        run: ./gradlew :rc-player-wasm:wasmPlayerTestDist

      # ...and then open it. Until #77 nothing did: the staged bundle was built on this runner,
      # size-checked, and thrown away, so a wasm regression that still compiled shipped. This is the
      # cheap lane and the bundle is already here, which is why the browser run belongs on Linux
      # rather than behind the macOS lane's gate.
      #
      # It is not the same coverage as `wasmJsBrowserTest` over on `apple-tests`: that runs the
      # Kotlin `commonTest` sources, this runs the *artifact* — the production-compiled
      # `rcPlayer.wasm`, `index.html`, the import map, the bundled font manifest and the embed
      # contract every host codes against.
      - name: Smoke-test the Wasm player bundle in a headless browser
        working-directory: scripts/wasm-smoke
        run: |
          npm ci
          npx playwright install chromium
          npm test

      # The 3D extension's WebGL2 depth renderer against its software rasterizer, in Chromium: the
      # production-compiled `:rc-player-3d` wasm tests, run by a page of their own. The runner has
      # no GPU, so WebGL2 is Chrome's software GL; see the script's header. Playwright and its
      # Chromium are already installed by the step above.
      - name: Test the 3D WebGL2 depth renderer in a headless browser
        if: needs.apple-changes.outputs.three-d != 'false'
        run: |
          ./gradlew :rc-player-3d:wasmWebGlTestDist
          (cd scripts/wasm-smoke && npm run test:3d)

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jvm-test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          retention-days: 7

  # The macOS lane, split into parallel jobs (#958) so the same checks finish in ~35-50 minutes
  # instead of running serially up to the old 150-minute ceiling:
  #
  #   Wave 1 (parallel, after `apple-changes`):
  #     - `apple-tests`           Kotlin/Native Apple + wasm tests and ABI gate (`lane == true`)
  #     - `apple-native-swift`    Pure-Swift tests, fuzzing, UIKit package & rc-swift-render (`required`)
  #     - `apple-link-framework`  3 parallel release links (`iosArm64`, `iosSimulatorArm64`, `macosArm64`)
  #   Wave 2 (after `apple-link-framework`):
  #     - `apple-xcframework`     Assembles `RcComposePlayer.xcframework` + reproducible zip/checksum
  #   Wave 3 (parallel, after `apple-xcframework`):
  #     - `apple-accessibility-ui`     XCUITest native UIKit accessibility suite (~24 min on its own)
  #     - `apple-simulator-validation` Swift sample check, iOS/macOS app packaging, AppKit evidence,
  #                                    and simulator screenshot/accessibility/animation validation
  #     - `apple-simulator-benchmarks` UIKit simulator performance, CMP comparison & nightly corpus
  #   Final (Ubuntu, ~10 s):
  #     - `apple-native-evidence` Merges partial evidence into `native-performance-evidence`

  apple-tests:
    name: Apple + wasm tests, ABI gate
    needs: apple-changes
    # Skipped on the release-please PR (see the note on `jvm`), and on a pull request that touches
    # none of the Apple projects (see `apple-changes`).
    if: ${{ needs.apple-changes.outputs.lane == 'true' && !(startsWith(github.head_ref || github.ref_name, 'release-please--') && (github.event.pull_request.user.login || github.actor) == 'github-actions[bot]') }}
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Temurin macOS arm64 release asset repeatedly returned HTTP 504. Use the
      # CDN-backed Zulu distribution for this runner while keeping the Java 17 toolchain.
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: zulu
          java-version: "17"
          check-latest: false
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: ./.github/actions/buildfetch-cache
        with:
          rw-token: ${{ github.event_name == 'push' && secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN || '' }}
          ro-token: ${{ secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN_RO }}
      # Keep the extracted Kotlin/Native prebuilt toolchain, LLVM/sysroot dependencies and target
      # klib caches across runs. Per-role keys prevent parallel jobs from overwriting each other's
      # target caches while sharing the Kotlin-version prefix as a fallback.
      - name: Cache Kotlin/Native toolchain (~/.konan)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ needs.apple-changes.outputs.kotlin-version }}-tests-v1
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-${{ needs.apple-changes.outputs.kotlin-version }}-
      - uses: ./.github/actions/select-xcode-26

      # No `iosX64` anywhere in this list. `:rc-player-compose` never had one — CMP 1.11 dropped the
      # Intel-iOS-simulator variant — and its three siblings dropped theirs when the stack became
      # publishable, because publishing a stack that resolves three of four artifacts on one target
      # is worse than not offering it. Naming a task that no longer exists fails the whole
      # invocation ("Cannot locate tasks that match ..."), not just that one target. The native
      # macOS target is arm64-only for the same reason.
      #
      # `allTests` does not imply `check`, so the ABI gate has to be named explicitly. Regenerate
      # the dumps with `./gradlew :rc-player-<module>:updateKotlinAbi` when a surface change is
      # intended.
      #
      # `allTests` also takes in each module's Android host suite (`testAndroidHostTest`). The JVM
      # and Android lane already runs those, on the runner that has the SDK and Robolectric's
      # runtime jars, so here they are excluded rather than run twice: on macOS, Robolectric has to
      # fetch its android-all jar from Maven at class setup, and that fetch is what failed.
      - name: Run the Apple player tests and the ABI gate
        run: |
          ./gradlew \
            -x :rc-player-trace:testAndroidHostTest \
            -x :rc-player-protocol:testAndroidHostTest \
            -x :rc-player-runtime:testAndroidHostTest \
            -x :rc-player-compose:testAndroidHostTest \
            -x :rc-player-edit:testAndroidHostTest \
            :rc-player-trace:checkKotlinAbi \
            :rc-player-protocol:checkKotlinAbi \
            :rc-player-runtime:checkKotlinAbi \
            :rc-player-compose:checkKotlinAbi \
            :rc-player-edit:checkKotlinAbi \
            :rc-creation-writer:checkKotlinAbi \
            :rc-creation-expression:checkKotlinAbi \
            :rc-creation-compose:checkKotlinAbi \
            :rc-creation-foundation:checkKotlinAbi \
            :rc-creation-wear-material3:checkKotlinAbi \
            :rc-creation-bridge:checkKotlinAbi \
            :rc-player-embedded:checkKotlinAbi \
            :rc-player-embedded:compileKotlinIosArm64 \
            :rc-player-embedded:compileKotlinIosSimulatorArm64 \
            :rc-player-embedded:compileKotlinMacosArm64 \
            :rc-player-trace:allTests \
            :rc-player-protocol:allTests \
            :rc-player-runtime:allTests \
            :rc-player-compose:allTests \
            :rc-player-edit:allTests \
            :rc-player-protocol:compileTestKotlinIosArm64 \
            :rc-player-protocol:compileTestKotlinIosSimulatorArm64 \
            :rc-player-runtime:compileTestKotlinIosArm64 \
            :rc-player-runtime:compileTestKotlinIosSimulatorArm64 \
            :rc-player-compose:compileTestKotlinIosArm64 \
            :rc-player-compose:compileTestKotlinIosSimulatorArm64 \
            :rc-player-protocol:compileTestKotlinMacosArm64 \
            :rc-player-runtime:compileTestKotlinMacosArm64 \
            :rc-player-compose:compileTestKotlinMacosArm64

      # `allTests` is an aggregate resolved per target on the runner, so until #77 the coverage it
      # gave was an assumption: a target whose test task drops out — no browser for
      # `wasmJsBrowserTest`, no bootable simulator for `iosSimulatorArm64Test` — leaves the job
      # green and the lane empty. Naming the four targets here turns that into a fact, and any
      # future `allTests` member that stops running fails the job that claims to run it.
      - name: Assert the Apple and wasm targets executed
        run: |
          scripts/assert-test-execution.sh \
            rc-player/trace:jvmTest,macosArm64Test,iosSimulatorArm64Test,wasmJsBrowserTest \
            rc-player/protocol:jvmTest,macosArm64Test,iosSimulatorArm64Test,wasmJsBrowserTest \
            rc-player/runtime:jvmTest,macosArm64Test,iosSimulatorArm64Test,wasmJsBrowserTest \
            rc-player/compose:jvmTest,macosArm64Test,iosSimulatorArm64Test,wasmJsBrowserTest \
            rc-player/edit:jvmTest,macosArm64Test,iosSimulatorArm64Test,wasmJsBrowserTest

      - name: Upload player test reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apple-test-reports
          path: |
            rc-player/**/build/reports/tests/**
            rc-player/**/build/test-results/**
          retention-days: 7

  # Pure-Swift and native-only checks: none of these depend on `RcComposePlayer.xcframework`, so
  # they start immediately alongside the framework links instead of waiting for them.
  apple-native-swift:
    name: Native Swift tests, fuzz, package and rc-swift-render
    needs: apple-changes
    if: ${{ needs.apple-changes.outputs.lane == 'true' && needs.apple-changes.outputs.required == 'true' && !(startsWith(github.head_ref || github.ref_name, 'release-please--') && (github.event.pull_request.user.login || github.actor) == 'github-actions[bot]') }}
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: zulu
          java-version: "17"
          check-latest: false
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: ./.github/actions/buildfetch-cache
        with:
          rw-token: ${{ github.event_name == 'push' && secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN || '' }}
          ro-token: ${{ secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN_RO }}
      - uses: ./.github/actions/select-xcode-26

      # `Package.swift`'s two SPM-verified values are written by the release job, never by hand.
      # This proves the writer still works before a release depends on it.
      - name: Run the Package.swift rewriter self-test
        run: scripts/update-package-swift.sh --self-test

      # Pure source zip + profile checksum: no Kotlin/Native dependency.
      - name: Package the native UIKit release archive
        run: ./gradlew :rc-player-compose:rcNativePlayerUIKitPackageChecksum

      - name: Validate the native UIKit release package
        run: scripts/check-native-uikit-package.sh

      - name: Validate the staged rc-swift mirror package on macOS
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          scripts/stage-rc-swift-repo.sh \
            "$work/rc-swift" \
            "rc-player/compose/build/distributions/RcNativePlayerUIKit.profile.json"
          swift build --package-path "$work/rc-swift"

      - name: Validate the native UIKit support profile
        run: scripts/check-native-uikit-profile.sh

      # The package's SwiftPM test targets on the macOS host: the pure-Swift core, every
      # renderer-neutral policy in `RcNativePlayerUIKit`, and the SwiftUI overlay's controller
      # backend for the native fallback. The fuzz suite is skipped here and run optimized below,
      # because its elapsed-time budget was calibrated against an `-O` build. Native-only mode keeps
      # the Kotlin binary target out of the package graph; nothing here needs the XCFramework.
      - name: Test the native Swift player on macOS
        env:
          RC_COMPOSE_PLAYER_NATIVE_ONLY: 1
        run: swift test --skip NativeSwiftFuzzTests

      # The same test targets built for, and run on, an iOS simulator: the only place the UIKit
      # renderer behind `#if canImport(UIKit)` is compiled as a package rather than through the
      # sample app.
      - name: Test the native Swift player on an iOS simulator
        run: scripts/check-native-swift-ios-tests.sh

      # visionOS has no Kotlin slice, so the overlay builds there against the native Swift player
      # alone (the manifest links the XCFramework on iOS and macOS only). A generic device build
      # needs only the xros SDK, not a simulator runtime. Xcode 26 ships visionOS as an optional
      # platform component, so an image without it skips with a warning rather than failing; once
      # the SDK is present, a build failure fails the job.
      - name: Build the native Swift packages for visionOS
        env:
          RC_COMPOSE_PLAYER_NATIVE_ONLY: 1
        run: |
          set -euo pipefail
          if ! xcodebuild -showsdks | grep -q -- '-sdk xros'; then
            echo "::warning::No visionOS SDK in $(xcode-select -p); skipping the visionOS build."
            exit 0
          fi
          xcodebuild build -quiet \
            -scheme RcComposePlayer-Package \
            -destination 'generic/platform=visionOS' \
            -derivedDataPath build/native-swift-visionos \
            CODE_SIGNING_ALLOWED=NO

      # The derived corpus, unsanitized and optimized (the script builds release when no sanitizer
      # is set). A failing fuzz input is the whole point of this test, and the default temporary
      # directory is not in the uploaded artifact.
      - name: Fuzz the pure Swift document core
        env:
          RC_NATIVE_FUZZ_CORPUS_OUT: ${{ github.workspace }}/build/native-fuzz-failures
        run: scripts/check-native-swift-fuzz.sh

      # The address-sanitized pass, shorter because the sanitizer is the expensive part, not the
      # mutation count.
      - name: Fuzz the pure Swift document core under AddressSanitizer
        env:
          RC_NATIVE_FUZZ_CORPUS_OUT: ${{ github.workspace }}/build/native-fuzz-failures
          RC_NATIVE_FUZZ_SANITIZE: address
          RC_NATIVE_FUZZ_ITERATIONS: 24
        run: scripts/check-native-swift-fuzz.sh

      - name: Benchmark the pure Swift document core
        run: scripts/measure-native-swift-core.sh

      # The release asset the preview server's `swift-appkit` lane downloads. The script renders a
      # fixture one-shot and through the worker frame protocol before it packages anything, so a
      # binary that cannot draw fails here rather than on someone's first render.
      - name: Build and smoke-test rc-swift-render
        run: scripts/package-swift-render.sh

      - name: Stage native core evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          if [ -f build/native-swift-core-benchmark.json ]; then
            cp build/native-swift-core-benchmark.json "$RUNNER_TEMP/evidence/"
          fi
          if [ -d build/native-fuzz-failures ]; then
            cp -R build/native-fuzz-failures "$RUNNER_TEMP/evidence/"
          fi

      - name: Upload native core evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-evidence-core
          path: ${{ runner.temp }}/evidence
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload native Swift iOS test reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-swift-ios-test-reports
          path: build/native-swift-ios-tests.xcresult
          if-no-files-found: ignore
          retention-days: 7

  # Link the three Apple release frameworks in parallel, each on its own runner so each link gets
  # the full 5 GB Gradle daemon heap (`gradle.properties`) without competing in one JVM.
  apple-link-framework:
    name: Link release framework (${{ matrix.target }})
    needs: apple-changes
    if: ${{ needs.apple-changes.outputs.lane == 'true' && needs.apple-changes.outputs.required == 'true' && !(startsWith(github.head_ref || github.ref_name, 'release-please--') && (github.event.pull_request.user.login || github.actor) == 'github-actions[bot]') }}
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: iosArm64
            task: linkReleaseFrameworkIosArm64
          - target: iosSimulatorArm64
            task: linkReleaseFrameworkIosSimulatorArm64
          - target: macosArm64
            task: linkReleaseFrameworkMacosArm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: zulu
          java-version: "17"
          check-latest: false
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: ./.github/actions/buildfetch-cache
        with:
          rw-token: ${{ github.event_name == 'push' && secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN || '' }}
          ro-token: ${{ secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN_RO }}
      - name: Cache Kotlin/Native toolchain (~/.konan)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ needs.apple-changes.outputs.kotlin-version }}-${{ matrix.target }}-v1
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-${{ needs.apple-changes.outputs.kotlin-version }}-
      - uses: ./.github/actions/select-xcode-26

      - name: Link release framework
        env:
          LINK_TASK: ${{ matrix.task }}
        run: ./gradlew ":rc-player-compose:${LINK_TASK}" --max-workers=1

      # Tar before uploading so `actions/upload-artifact`'s zip layer preserves macOS versioned
      # framework symlinks (`Versions/Current`, `Headers`, `Modules`, `Resources`) and file modes.
      - name: Archive linked framework
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          COPYFILE_DISABLE=1 tar -cf "$RUNNER_TEMP/framework-${TARGET}.tar" \
            -C rc-player/compose/build/bin \
            "${TARGET}/releaseFramework"

      - name: Upload linked framework
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rc-compose-framework-${{ matrix.target }}
          path: ${{ runner.temp }}/framework-${{ matrix.target }}.tar
          retention-days: 1

  # Assemble `RcComposePlayer.xcframework`, its reproducible SPM zip and its SHA-256 checksum from
  # the three independently linked frameworks. Runs the same Gradle packaging tasks `release.yml`
  # drives, excluding the already-completed link tasks so no Kotlin/Native compilation runs here.
  apple-xcframework:
    name: Assemble release XCFramework
    needs: [apple-changes, apple-link-framework]
    if: ${{ needs.apple-link-framework.result == 'success' }}
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: zulu
          java-version: "17"
          check-latest: false
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: ./.github/actions/buildfetch-cache
        with:
          rw-token: ${{ github.event_name == 'push' && secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN || '' }}
          ro-token: ${{ secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN_RO }}
      - uses: ./.github/actions/select-xcode-26

      - name: Download the linked release frameworks
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rc-compose-framework-*
          path: ${{ runner.temp }}/frameworks
          merge-multiple: true

      - name: Extract the linked release frameworks
        run: |
          set -euo pipefail
          mkdir -p rc-player/compose/build/bin
          for target in iosArm64 iosSimulatorArm64 macosArm64; do
            archive="$RUNNER_TEMP/frameworks/framework-${target}.tar"
            if [ ! -f "$archive" ]; then
              echo "Missing linked framework archive: $archive" >&2
              exit 1
            fi
            tar -xf "$archive" -C rc-player/compose/build/bin
          done

      - name: Assemble the release XCFramework
        run: |
          ./gradlew \
            :rc-player-compose:rcPlayerXcframeworkChecksum \
            -x :rc-player-compose:linkReleaseFrameworkIosArm64 \
            -x :rc-player-compose:linkReleaseFrameworkIosSimulatorArm64 \
            -x :rc-player-compose:linkReleaseFrameworkMacosArm64

      - name: Archive assembled XCFramework
        run: |
          set -euo pipefail
          COPYFILE_DISABLE=1 tar -cf "$RUNNER_TEMP/RcComposePlayer.xcframework.tar" \
            -C rc-player/compose/build/XCFrameworks/release \
            RcComposePlayer.xcframework

      - name: Upload assembled XCFramework
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rc-compose-xcframework
          path: ${{ runner.temp }}/RcComposePlayer.xcframework.tar
          retention-days: 1

  # XCUITest accessibility validation builds directly against `RcComposePlayer.xcframework` and
  # takes ~24 minutes on its own, so it runs in parallel with the other XCFramework consumers.
  apple-accessibility-ui:
    name: Apple UIKit accessibility UI tests
    needs: [apple-changes, apple-xcframework]
    if: ${{ needs.apple-xcframework.result == 'success' }}
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/select-xcode-26

      - name: Download the assembled XCFramework
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rc-compose-xcframework
          path: ${{ runner.temp }}/xcframework

      - name: Extract the assembled XCFramework
        run: |
          set -euo pipefail
          mkdir -p rc-player/compose/build/XCFrameworks/release
          tar -xf "$RUNNER_TEMP/xcframework/RcComposePlayer.xcframework.tar" \
            -C rc-player/compose/build/XCFrameworks/release

      - name: Validate native UIKit accessibility UI
        run: scripts/check-native-uikit-accessibility-ui.sh

      - name: Upload native UIKit accessibility UI results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apple-accessibility-ui-results
          path: |
            build/native-uikit-accessibility-ui.xcresult
            build/native-uikit-accessibility-ui-first-attempt.xcresult
          if-no-files-found: ignore
          retention-days: 7

  # Swift usage sample type-check, iOS & macOS app packaging, AppKit evidence, and simulator
  # screenshot / accessibility presentation / animation validation.
  apple-simulator-validation:
    name: Apple app packaging and simulator validation
    needs: [apple-changes, apple-xcframework]
    if: ${{ needs.apple-xcframework.result == 'success' }}
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/select-xcode-26

      - name: Download the assembled XCFramework
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rc-compose-xcframework
          path: ${{ runner.temp }}/xcframework

      - name: Extract the assembled XCFramework
        run: |
          set -euo pipefail
          mkdir -p rc-player/compose/build/XCFrameworks/release
          tar -xf "$RUNNER_TEMP/xcframework/RcComposePlayer.xcframework.tar" \
            -C rc-player/compose/build/XCFrameworks/release

      # Type-checks the Swift sample in docs/design/RC_PLAYER_SWIFT.md against the real framework.
      # Exits 0 and says so when no framework is present, so it is honest about what it checked —
      # with the XCFramework extracted above, a framework *is* present and this genuinely
      # type-checks.
      - name: Type-check the Swift usage sample
        run: scripts/check-swift-sample.sh

      # A header-only type check cannot catch application-host contracts. In particular,
      # ComposeUIViewController enforces its high-refresh plist entry at runtime, and Xcode's
      # generic Simulator build asks for x86_64 unless the arm64-only framework constraint is
      # stated by the consumer. The project links the XCFramework assembled above, so its binary
      # and source overlay always describe the same current API.
      - name: Build and package the Apple player apps
        # The framework is assembled by `apple-xcframework`. Requiring it rather than letting the
        # script assemble one keeps a fault in that job loud: a silent twenty-minute rebuild here
        # would hide it and bill the job for it.
        env:
          RC_APPLE_PLAYER_REQUIRE_FRAMEWORK: 1
        run: |
          scripts/package-apple-player.sh
          scripts/package-macos-player.sh

      # This is intentionally an evidence lane rather than a timing gate. Both implementations run
      # from the packaged Release macOS app on the runner's Apple-silicon host; no simulator is
      # involved, and host load still makes the numbers unsuitable as a product SLA.
      - name: Compare Apple player macOS benchmarks
        if: github.event_name != 'push'
        run: scripts/measure-apple-players-macos.sh

      - name: Measure native AppKit performance and footprint
        run: scripts/measure-native-appkit.sh

      # Launches the packaged app on a real simulator and checks captured pixels for the white
      # title-card canvas, its dark content band, and the coloured host background. This covers the
      # Metal/Skiko presentation path that Kotlin/Native tests and a Swift type check cannot enter.
      - name: Validate the Apple player screenshot
        run: scripts/check-apple-player-screenshot.sh

      - name: Validate native UIKit accessibility presentation
        run: scripts/check-native-uikit-accessibility-simulator.sh

      - name: Validate native UIKit animation pacing
        run: scripts/check-native-uikit-animation-simulator.sh

      - name: Stage AppKit performance evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          if [ -f build/apple-player-benchmark.json ]; then
            cp build/apple-player-benchmark.json "$RUNNER_TEMP/evidence/"
          fi
          if [ -f build/native-appkit-evidence.json ]; then
            cp build/native-appkit-evidence.json "$RUNNER_TEMP/evidence/"
          fi

      - name: Upload AppKit performance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-evidence-appkit
          path: ${{ runner.temp }}/evidence
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload the Apple player screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apple-player-screenshot
          path: |
            build/apple-player-screenshot.png
            build/native-uikit-accessibility.png
            build/native-uikit-animation-a.png
            build/native-uikit-animation-b.png
          if-no-files-found: ignore
          retention-days: 7

  # Simulator performance budgets, CMP vs native UIKit comparison, and the nightly catalog corpus
  # score. Runs in parallel with `apple-simulator-validation` and `apple-accessibility-ui`.
  apple-simulator-benchmarks:
    name: Apple simulator benchmarks and comparison
    needs: [apple-changes, apple-xcframework]
    if: ${{ needs.apple-xcframework.result == 'success' }}
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Java and Gradle are only needed by `check-native-uikit-comparison.sh` and
      # `check-native-uikit-corpus.sh` (which drive `:rc-player-compose:jvmTest` for the CMP JVM
      # baseline); neither runs on `push` to main.
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        if: github.event_name != 'push'
        with:
          distribution: zulu
          java-version: "17"
          check-latest: false
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        if: github.event_name != 'push'
      - uses: ./.github/actions/buildfetch-cache
        if: github.event_name != 'push'
        with:
          rw-token: ''
          ro-token: ${{ secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN_RO }}
          read-only-by-design: 'true'
      - uses: ./.github/actions/select-xcode-26

      - name: Download the assembled XCFramework
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rc-compose-xcframework
          path: ${{ runner.temp }}/xcframework

      - name: Extract the assembled XCFramework
        run: |
          set -euo pipefail
          mkdir -p rc-player/compose/build/XCFrameworks/release
          tar -xf "$RUNNER_TEMP/xcframework/RcComposePlayer.xcframework.tar" \
            -C rc-player/compose/build/XCFrameworks/release

      - name: Build and package the iOS simulator app
        env:
          RC_APPLE_PLAYER_REQUIRE_FRAMEWORK: 1
        run: scripts/package-apple-player.sh

      - name: Measure native UIKit performance and footprint
        run: scripts/measure-native-uikit-simulator.sh

      - name: Compare Apple player iOS simulator benchmarks
        if: github.event_name != 'push'
        env:
          RC_APPLE_PLAYER_BENCHMARK_OUTPUT: ${{ github.workspace }}/build/apple-player-simulator-benchmark.json
        run: scripts/measure-apple-players-simulator.sh

      # Evidence, not a gate (its script has no budget to fail): pull requests that touch the Apple
      # lane still get the comparison, and main gets it nightly rather than on every merge.
      - name: Compare native UIKit against CMP on representative content
        if: github.event_name != 'push'
        env:
          RC_NATIVE_UIKIT_SKIP_BUILD: 1
        run: scripts/check-native-uikit-comparison.sh

      # The same two lanes over real Material 3 documents from wear-m3-catalog, instead of the four
      # fixtures above. ENRICHMENT: it reports what the native player declines rather than failing
      # on it. See docs/design/RC_CATALOG_CORPUS_LANE.md.
      #
      # NIGHTLY ONLY (schedule, or a manual dispatch). `continue-on-error` keeps a crash in either
      # lane non-gating while still showing as failed and reporting why.
      - name: Score native UIKit against CMP on the catalog corpus
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          RC_NATIVE_UIKIT_SKIP_BUILD: 1
        run: scripts/check-native-uikit-corpus.sh

      - name: Stage native UIKit performance and comparison evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          if [ -f build/native-uikit-evidence.json ]; then
            cp build/native-uikit-evidence.json "$RUNNER_TEMP/evidence/"
          fi
          if [ -f build/apple-player-simulator-benchmark.json ]; then
            cp build/apple-player-simulator-benchmark.json "$RUNNER_TEMP/evidence/"
          fi
          if [ -d build/native-uikit-comparison ]; then
            cp -R build/native-uikit-comparison "$RUNNER_TEMP/evidence/"
          fi
          if [ -f build/native-uikit-corpus/comparison.json ]; then
            mkdir -p "$RUNNER_TEMP/evidence/native-uikit-corpus"
            cp build/native-uikit-corpus/comparison.json "$RUNNER_TEMP/evidence/native-uikit-corpus/"
          fi

      - name: Upload native UIKit performance and comparison evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-evidence-uikit
          path: ${{ runner.temp }}/evidence
          if-no-files-found: ignore
          retention-days: 1

  # Machine-readable, budget-carrying evidence for all three native lanes, plus the rendered
  # comparison output — combined back into the single `native-performance-evidence` artifact named
  # by `distribution/native-uikit/profile.json`. Uploaded whether or not the upstream jobs passed,
  # because a regression is reviewed from the numbers.
  apple-native-evidence:
    name: Bundle native performance evidence
    needs: [apple-changes, apple-native-swift, apple-simulator-validation, apple-simulator-benchmarks]
    if: ${{ always() && !cancelled() && needs.apple-changes.outputs.lane == 'true' && needs.apple-changes.outputs.required == 'true' && !(startsWith(github.head_ref || github.ref_name, 'release-please--') && (github.event.pull_request.user.login || github.actor) == 'github-actions[bot]') && (needs.apple-native-swift.result != 'skipped' || needs.apple-simulator-validation.result != 'skipped' || needs.apple-simulator-benchmarks.result != 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download partial native evidence artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-evidence-*
          path: ${{ runner.temp }}/evidence
          merge-multiple: true

      - name: Upload native performance and comparison evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-performance-evidence
          if-no-files-found: warn
          path: ${{ runner.temp }}/evidence
