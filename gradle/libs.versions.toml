[versions]
# Held at 2.4.0: CodeQL's Kotlin extractor doesn't support 2.4.10 yet — it aborts with
# `Kotlin version too new`, which fails the `Analyze (java-kotlin)` job as a configuration error
# and leaves the repo's main language unscanned. Bump once the CodeQL bundle catches up (the
# alternative, disabling Kotlin extraction, would trade away the scan itself).
kotlin = "2.4.10"
# Kotlin language/api floor for published modules. Set lower than `kotlin`
# so consumers on an older Kotlin can still link against our artifacts —
# tapmoc enforces this and fails the build if a transitive API dep raises
# the floor. Bump only when the published surface needs a newer feature.
# 2.0.21 captures consumers on Kotlin 2.0.x (e.g. apps still on Gradle 8.x,
# whose embedded Kotlin runtime tops out around 2.0.21); we use no 2.1+
# language features in any published module so dropping to 2.0.21 has zero
# cost on our source today.
# Caveat: the 2.3.x compiler emits `Language version 2.0 is deprecated and
# its support will be removed in a future version of Kotlin`. That warning
# is silenced via `-Xsuppress-version-warnings` in the modules calling
# `configureKotlinCompatibility(...)`; remove the flag (and bump this to
# `2.1.x`) when the removal lands and we're ready to drop 2.0.x consumers.
kotlinCoreLibraries = "2.0.21"
agp = "9.3.2"
ktfmt = "0.27.0"
tapmoc = "0.4.2"
# Released versions only. Robolectric publishes `4.17-SNAPSHOT` to Sonatype, and Renovate ranks it
# above `4.17-beta-2` — but no snapshot repository is declared here (nor should one be, for a
# reproducible build), so a snapshot pin fails dependency resolution outright. The
# `org.robolectric:robolectric` rule in `.github/renovate.json` keeps that bump from coming back.
#
# Unpinned from `4.17-beta-2` in #4549. From `4.17-beta-3` Robolectric rewrites every `FrameInfo`
# timestamp into the host's monotonic clock domain before handing a frame to hwui, which paced a
# held session's render-thread animations (Material's `RippleDrawable`) by wall-clock time instead
# of the simulated clock — the live lane's press feedback went dark, measured in pixels by
# `LivePressRippleTest` and `AndroidRippleFrameTest`. `ShadowPausedClockHardwareRenderer` in
# `:daemon:android` draws held frames with those timestamps untranslated, which restores beta-2
# behaviour inside the daemon sandbox; those two tests are the acceptance check for any bump here,
# not just a green build.
robolectric = "4.17-beta-4"
# androidx.tracing — atrace-level sections for the Android daemon's render phases (see
# `AndroidxTraceSections` in :daemon:android). Version-pinned (not BOM-managed) because the daemon
# ships it in the standalone lib-daemon-android sidecar where no BOM applies.
androidx-tracing = "2.0.1"
# androidx.tracing 2.x — the Kotlin Multiplatform rewrite, used by the CMP Remote Compose player
# stack through `:rc-player-trace`. Pinned separately from `androidx-tracing` above rather than
# bumping it: 2.x drags `kotlinx-coroutines-core` and `androidx.collection` in, which the daemon's
# standalone `lib-daemon-android` sidecar would then have to package, and the daemon only wants the
# atrace-shaped `Trace.beginSection` that 1.3.0 already gives it. The two coordinates never meet on
# one classpath. Note 2.x publishes only `androidJvm` + `jvm` variants — there is no wasmJs or Apple
# klib, which is the whole reason `:rc-player-trace` is an `expect`/`actual` facade.
androidx-tracing-kmp = "2.0.1"
# renderer-android compiles its public API surface against this OLDER BOM so
# the emitted bytecode only references Compose 1.9.x method signatures.
# AndroidX honours binary-backward-compatibility within a major version, so
# consumer apps on any Compose 1.9+ runtime (including the current 1.10.x /
# 1.11.x BOMs) can invoke it without NoSuchMethodError. When bumping this,
# check `./gradlew :renderer-android:compileKotlin` against the new floor.
# 2025.11.01 pins compose-ui AND compose-runtime to 1.9.5 — latest 1.9.x
# release line. See https://developer.android.com/develop/ui/compose/bom/bom-mapping
# Renovate is constrained to the 2025.11.x line in `.github/renovate.json` —
# raising the supported-Compose-minimum is a manual decision.
compose-bom-compat = "2025.11.01"
# The desktop/Skiko floor for `renderer-desktop`, `daemon-desktop`, `bundle-viewer` and the CMP
# player. This version is also a CEILING CONSTRAINT ON EVERY CATALOG THE SERVE HOST RENDERS LIVE:
# it must be >= the newest `compose-multiplatform` of any catalog served from this host. A catalog
# that upgrades ahead of the host pairs its newer `org.jetbrains.skia.*` bindings with the sidecar's
# older `libskiko` and every live render dies with `UnsatisfiedLinkError` — silently, at
# regeneration time, with baked PNGs still serving fine. That is issue #3447: m3-catalog moved to
# CMP 1.11.1 (skiko 0.144.6, which introduced `org.jetbrains.skia.PathBuilder`) while the host was
# on 1.10.3 (skiko 0.9.37.4, whose native exports no `PathBuilder_*` symbol at all). Bumping this
# ref is therefore a SERVE-HOST RELEASE concern, not just a build-hygiene one — see
# `docs/RENDERER_COMPATIBILITY.md`.
#
# HELD AT 1.11.1 — 1.12.0 is not a minor/patch bump this ref can take on its own (#4503):
#   * `androidx.compose.*:1.12.0` AAR metadata declares `minCompileSdk = 37`, so every Android
#     module on the conventions default (`compileSdk = 36`) fails `checkAarMetadata` — the bump is
#     a repo-wide platform move, not a version-ref edit.
#   * skiko 0.150.1 (what 1.12.0 resolves) REMOVES the mutating `org.jetbrains.skia.Path` API that
#     m144 had only deprecated at `DeprecationLevel.ERROR`. `Path.conicTo` is gone, which breaks
#     `PathConic.{jvm,wasm,ios}.kt` and the vendored `FloatsToPath.kt`; the replacement
#     (`PathBuilder`) is build-then-`snapshot()`, so those seams have to be restructured.
#   * `compose-multiplatform-material3` (1.11.0-alpha07) and `compottie` (built against foundation
#     1.11.0) move in lockstep with this ref — see their comments below.
# The Renovate rule for `org.jetbrains.compose**` in `.github/renovate.json` now tracks the 1.11.x
# line so the group stops re-proposing this; moving to 1.12 is a deliberate, coordinated change.
compose-multiplatform = "1.11.1"
wear-compose = "1.7.0-beta02"
# `androidx.wear:wear` carries `androidx.wear.ambient.AmbientLifecycleObserver` —
# the AOSP entry point both horologist's `AmbientAware` and direct subscribers
# wrap. Used only by `:data-ambient-connector` (the Robolectric shadow + state
# controller) so consumer code wired to `AmbientAware { ... }` can render under
# a synthetic ambient state without flashing a real watch.
wear = "1.4.0"
# Remote Compose — released alpha coordinates from Google Maven. See
# https://developer.android.com/jetpack/androidx/releases/compose-remote.
# Used by `:samples:remotecompose` to demonstrate `RemotePreview` +
# `@PreviewWrapper(RemotePreviewWrapper::class)`, by the daemon connector, and
# by the vendored embedded player. Re-check minCompileSdk / AGP requirements
# when bumping — the line has historically tightened them.
#  * ui-tooling-preview 1.11.0-rc01 is the first released artifact that
#    contains `PreviewWrapper` / `PreviewWrapperProvider` — 1.10.x (the
#    current BOM) doesn't have them. Declared explicitly because the
#    sample doesn't depend on compose-bom.
#  * This ref and the `wear-compose-remote` / `glance-wear` refs below MUST be
#    bumped as one set, to versions built against the same `remote-creation*`.
#    The three groups only work together when they were, and matching them by
#    hand kept going wrong: alpha09 dropped
#    `…creation.compose.modifier.ClickActionModifierKt` that
#    `remote-material3:alpha02` still called, giving a runtime
#    `NoClassDefFoundError` inside `RemoteButtonImpl` at render time; a Renovate
#    bump of the `alpha11` / `alpha04` pair took CI red on both the Kotlin
#    compile and the daemon-harness render; and #2823 once pinned a
#    `wear-compose-remote` version that didn't exist yet (every artifact 404'd),
#    making every Remote Compose module here unresolvable. Check the POMs
#    before landing a bump: `remote-material3:1.0.0-alpha10` and
#    `androidx.glance.wear:*:1.0.0-alpha17` both declare `remote-creation*`
#    `1.0.0-alpha18`, which is what makes the current trio consistent.
#  * To try an API that has landed on androidx-main but is not released yet, run
#    with `-Pcomposeai.remoteCompose=snapshot`: `settings.gradle.kts` then adds
#    the build-id-pinned androidx.dev repository and rewrites all three refs to
#    `1.0.0-SNAPSHOT`. The snapshot lane is opt-in and temporary — CI, published
#    consumers and every default build stay on these released pins.
#  * API drift still happens between alphas, and it lands in the samples +
#    connector, not just in resolution. Past migrations, for shape: `HostAction`
#    went `internal` (build actions via the public `hostAction(...)` factory
#    returning `Action`); `captureSingleRemoteDocument` took on
#    `RemoteCreationDisplayInfo` + `RemoteDensity` + `LayoutDirection`;
#    `RemotePreview` became `RemoteContentPreview`; `RemoteDensity.from` dropped
#    its trailing `Context` arg. Expect the same class of fix when these pins
#    move — verify a render, not just a compile.
compose-remote = "1.0.0-alpha18"
# Matches what the `compose-bom-compat` Compose artifacts already resolve collection to; pinned
# explicitly because `:third-party-rc-embedded-player` names `ObjectIntMap`/`IntObjectMap` directly.
androidx-collection = "1.6.0"
# `FontRequest` / `FontsContractCompat` — the downloadable-fonts provider API the vendored embedded
# player's typeface resolver uses to service `google:` font prefixes.
androidx-core = "1.19.0"
# Wear Compose Remote Material 3 — `androidx.wear.compose.remote:remote-material3`,
# the Wear M3 widget layer on top of Remote Compose, used by `:samples:remotecompose`
# and `:samples:wear-widget` (and, out of tree, by the `remote-m3` catalog in
# yschimke/wear-m3-catalog, which resolves this same coordinate from Google Maven).
# Its POM declares the `remote-creation*`
# version it was compiled against (alpha10 → alpha18), so bump it together with
# `compose-remote` above and `glance-wear` below. It also pulls
# `androidx.compose.remote.foundation:foundation`, which used to exist only on the
# androidx-main snapshot line and now publishes to Google Maven — that is what
# unblocked the move back to released coordinates.
wear-compose-remote = "1.0.0-alpha10"
kotlinx-coroutines = "1.11.0"
kotlinx-datetime = "0.8.0"
kotlinx-serialization = "1.11.0"
okio = "3.18.1"
junit = "4.13.2"
truth = "1.4.5"
maven-publish = "0.37.0"

# The wire contracts, now published from yschimke/compose-preview-contracts rather than built
# here. This repository consumes them; it no longer owns these coordinates. A change to a contract
# reaches this build only through a release there — see that repository's docs/VERSIONING.md.
# A point pin, deliberately: a range would let a contract change arrive without a pull request.
composeai-contracts = "2.18.0"

# compose-preview-daemon, for the two modules this build consumes from it: `data-fonts-google`
# (the `(family, weight, italic) -> File` downloadable-font cache both vendored players share) and
# `data-layoutinspector-connector` (the production `compose/figma-svg` export the players' captured
# trees are run through). Both were `project(...)` deps until the player stack was extracted into
# this repository, and rode compose-ai-tools' release train (`composeai-tools`) until the data
# extractors moved to yschimke/compose-preview-daemon in compose-ai-tools#5336; they ride that
# repository's line now — 3.x, a different number from `composeai-contracts` above, which is on 2.x.
composeai-preview-daemon = "3.4.3"

[libraries]

composeai-data-layoutinspector-core = { module = "ee.schimke.composeai:data-layoutinspector-core", version.ref = "composeai-contracts" }
composeai-common-io = { module = "ee.schimke.composeai:common-io", version.ref = "composeai-contracts" }

# compose-preview-daemon modules (see `composeai-preview-daemon`).
composeai-data-fonts-google = { module = "ee.schimke.composeai:data-fonts-google", version.ref = "composeai-preview-daemon" }
composeai-data-layoutinspector-connector = { module = "ee.schimke.composeai:data-layoutinspector-connector", version.ref = "composeai-preview-daemon" }

robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
compose-bom-compat = { module = "androidx.compose:compose-bom", version.ref = "compose-bom-compat" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
# Downloadable Google-Fonts faces (`Font(GoogleFont("Orbitron"), provider)`). Test-only here: the
# fixture preview that proves the figma-svg export names a branded downloadable family instead of
# collapsing to Roboto. Versioned by `compose-bom-compat`.
compose-ui-text-google-fonts = { module = "androidx.compose.ui:ui-text-google-fonts" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
# `CubicBezierEasing`, which the vendored Horologist Lottie renderer evaluates keyframe easing
# with. Versioned by `compose-bom-compat`, like every other unversioned Compose entry here.
compose-animation-core = { module = "androidx.compose.animation:animation-core" }
compose-animation = { module = "androidx.compose.animation:animation" }
compose-runtime = { module = "androidx.compose.runtime:runtime" }
androidx-tracing = { module = "androidx.tracing:tracing", version.ref = "androidx-tracing" }
androidx-tracing-kmp = { module = "androidx.tracing:tracing", version.ref = "androidx-tracing-kmp" }
androidx-tracing-wire = { module = "androidx.tracing:tracing-wire", version.ref = "androidx-tracing-kmp" }
jetbrains-compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
jetbrains-compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }
jetbrains-compose-ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "compose-multiplatform" }
jetbrains-compose-ui-tooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "compose-multiplatform" }
jetbrains-compose-components-ui-tooling-preview = { module = "org.jetbrains.compose.components:components-ui-tooling-preview", version.ref = "compose-multiplatform" }
wear = { module = "androidx.wear:wear", version.ref = "wear" }
compose-remote-creation = { module = "androidx.compose.remote:remote-creation", version.ref = "compose-remote" }
compose-remote-creation-compose = { module = "androidx.compose.remote:remote-creation-compose", version.ref = "compose-remote" }
compose-remote-player-compose = { module = "androidx.compose.remote:remote-player-compose", version.ref = "compose-remote" }
compose-remote-player-core = { module = "androidx.compose.remote:remote-player-core", version.ref = "compose-remote" }
compose-remote-player-view = { module = "androidx.compose.remote:remote-player-view", version.ref = "compose-remote" }
# The document/operation model itself. Upstream builds this one as a plain `java-library` (no
# Android), which is what makes a jvm target of `:third-party-rc-embedded-player` possible — the
# vendored player reads `androidx.compose.remote.core.*` directly rather than only through the
# Android-only `remote-player-core`.
compose-remote-core = { module = "androidx.compose.remote:remote-core", version.ref = "compose-remote" }
# `ObjectIntMap` / `IntObjectMap` in the vendored embedded player's public signatures. Compose pulls
# collection in transitively, but the player names the types directly so it declares them itself.
androidx-collection = { module = "androidx.collection:collection", version.ref = "androidx-collection" }
androidx-core = { module = "androidx.core:core", version.ref = "androidx-core" }
wear-compose-remote-material3 = { module = "androidx.wear.compose.remote:remote-material3", version.ref = "wear-compose-remote" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
junit = { module = "junit:junit", version.ref = "junit" }
truth = { module = "com.google.truth:truth", version.ref = "truth" }
# ASM — used by `:daemon:harness`'s `S3_5RecompileSaveLoopRealModeTest` to mint two
# `.class` files with the same FQN (`ee.schimke.composeai.daemon.MutableSquare`) but different
# bytecode at test time. The B2.0 disposable user-classloader test asserts that the daemon
# actually re-reads bytecode after a `fileChanged` notification; without two distinct `.class`
# files the test can't differentiate "stale" from "fresh".
asm = { module = "org.ow2.asm:asm", version = "9.10.1" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish" }
ktfmt = { id = "com.ncorti.ktfmt.gradle", version.ref = "ktfmt" }
tapmoc = { id = "com.gradleup.tapmoc", version.ref = "tapmoc" }
